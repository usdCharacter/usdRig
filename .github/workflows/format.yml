name: C++ formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==18.1.8
      - name: Test formatter selection and policy
        run: python -m unittest discover -s tests/tools -p test_cpp_format.py
      - name: Check changed C++ files
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python bin/format_cpp.py --base "$FORMAT_BASE"
