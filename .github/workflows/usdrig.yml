# Release C++ coverage on Linux, Windows and macOS. Python, usdview and
# interactive graphics remain workstation checks. Cache unchanged OpenUSD
# separately from the project; retain test logs even when CTest fails.

name: usdRig

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: usdrig-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hidden-locks:
    name: no new hidden locks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Scan parallel-lane sources
        run: python3 tools/check_hidden_locks.py

  runtime-usd-free:
    name: runtime compiles without OpenUSD
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 20
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install a compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++

      # The check compiles the configured runtime sources (including the
      # generated mover kernels) from this checkout, so it needs the
      # build tree's source manifests.
      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract build tree
        run: |
          mkdir -p build
          tar -C build -xf usdrig-build.tar

      - name: Compile the runtime with no pxr include path
        run: bin/check_runtime_usd_free.sh

  # --------------------------------------------------------------------------
  # OpenUSD v26.08 (PixarAnimationStudios/OpenUSD @ tag v26.08).
  # Cache key = OS + arch + resolved commit + recipe epoch. Bump the epoch
  # ("exec-usdimg-gl-nopy-v1" -> "...-v2") whenever the build_usd.py
  # invocation changes so two prefixes from the same commit with different
  # options never alias.
  # --------------------------------------------------------------------------
  openusd:
    name: OpenUSD v26.08
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      openusd-sha: ${{ steps.openusd-sha.outputs.sha }}
    steps:
      - name: Checkout OpenUSD @ v26.08
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          fetch-depth: 1

      - name: OpenUSD commit (cache key)
        id: openusd-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-setuptools \
            libglew-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev xorg-dev ninja-build

      - name: Restore cached OpenUSD install prefix
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-nopy-v1

      - name: Build OpenUSD (Release, Ninja, imaging, OpenExec)
        # build_scripts/build_usd.py is the v26.08 entry point.
        # --usd-imaging     -> PXR_BUILD_IMAGING=ON + PXR_BUILD_USD_IMAGING=ON
        # --no-usdview      -> skip PySide/PyOpenGL
        # --no-python       -> first-gate prefix: C++ tests do not need pxr
        #                      Python bindings. Python + usdNoodles return
        #                      when that job is added.
        # --no-materialx    -> drop MaterialX
        # --build-args USD  -> keep OpenExec on even if a later OpenUSD
        #                      default flips (PXR_BUILD_EXEC is ON in 26.08)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 build_scripts/build_usd.py \
            usd-install \
            --build usd-build \
            --generator Ninja \
            --build-variant release \
            --jobs 4 \
            --usd-imaging \
            --no-usdview \
            --no-python \
            --no-tests --no-examples --no-tutorials --no-docs \
            --no-materialx \
            --build-args USD,"-DPXR_BUILD_EXEC=ON" \
            -v

      - name: Drop OpenUSD build tree
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf usd-build

      - name: Save OpenUSD install prefix to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-nopy-v1

      - name: Sanity - libraries usdRig links are present
        run: |
          for lib in \
            libusd_usd.so libusd_tf.so libusd_sdf.so libusd_gf.so \
            libusd_arch.so libusd_vt.so libusd_plug.so libusd_work.so \
            libusd_usdGeom.so libusd_usdSkel.so libusd_usdUtils.so \
            libusd_usdImaging.so libusd_hd.so \
            libusd_exec.so libusd_execUsd.so libusd_ef.so \
            libusd_vdf.so libusd_esf.so libusd_esfUsd.so
          do
            test -e "usd-install/lib/$lib" || { echo "missing usd-install/lib/$lib"; exit 1; }
          done
          test -d usd-install/plugin/usd
          test -e usd-install/pxrConfig.cmake \
            || test -e usd-install/lib/cmake/pxr/pxrConfig.cmake \
            || { echo "missing pxrConfig.cmake under usd-install"; exit 1; }

      - name: Pack OpenUSD prefix as tarball
        run: tar -C usd-install -cf usd-install.tar .

      - name: Upload OpenUSD prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: usd-install.tar
          path: usd-install.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Configure only. Proves find_package(pxr) + the first-gate cache vars
  # against a clean runner. FETCHCONTENT is unused while usdNoodles is off,
  # so this is already an offline configure.
  # --------------------------------------------------------------------------
  configure:
    name: configure
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 20
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install configure dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF

  # --------------------------------------------------------------------------
  # Release build + rigExecPose smoke on the smallest shipped rig.
  # --------------------------------------------------------------------------
  build-release:
    name: usdRig build (Release)
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 90
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF

      - name: Build
        run: ninja -C build -j"$(nproc)"

      - name: rigExecPose smoke
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          "${GITHUB_WORKSPACE}/build/rigExecPose" \
            "${GITHUB_WORKSPACE}/examples/rigexec_flat.usda" \
            --frames 0,50,100 --joints

      - name: Pack build tree
        run: tar -C build -cf usdrig-build.tar .

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: usdrig-build.tar
          path: usdrig-build.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Full configured CTest suite, including cone verification and example
  # parity. Name and label filters are reserved for local focused runs.
  # --------------------------------------------------------------------------
  ctest-cpp:
    name: ctest (full suite)
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 45
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract
        run: |
          mkdir -p usd-install build
          tar -C usd-install -xf usd-install.tar
          tar -C build -xf usdrig-build.tar

      # Imaging and GPU test binaries link OpenGL at load time through
      # garch, so this fresh runner needs the same GL/X11 closure the
      # build jobs installed.
      - name: Install test runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev

      - name: Run full CTest suite
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          ctest --test-dir build \
            -j"$(nproc)" \
            --output-on-failure --no-tests=error

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux
          path: build/Testing/Temporary/

  # --------------------------------------------------------------------------
  # Install tree: cmake --install into a scratch prefix, then verify the
  # layout the README documents (lib/, lib/usd/<plugin>/resources/,
  # include/, lib/cmake/rigExec).
  # --------------------------------------------------------------------------
  install-check:
    name: usdRig install layout + plugInfo
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 20
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install consumer build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract
        run: |
          mkdir -p usd-install build
          tar -C usd-install -xf usd-install.tar
          tar -C build -xf usdrig-build.tar

      - name: Install into scratch prefix
        run: cmake --install build --prefix "${GITHUB_WORKSPACE}/usdrig-install"

      - name: Verify installed layout
        run: |
          P="${GITHUB_WORKSPACE}/usdrig-install"
          for f in \
            "$P/lib/librigExec.so" \
            "$P/lib/librigExecScene.so" \
            "$P/lib/librigExecOracle.so" \
            "$P/lib/librigExecImaging.so" \
            "$P/lib/librigExecStandalone.so" \
            "$P/lib/librigExecAuthoring.so" \
            "$P/lib/usd/rigExecSchema/resources/plugInfo.json" \
            "$P/lib/usd/rigExecSchema/resources/generatedSchema.usda" \
            "$P/lib/usd/rigExecImaging/resources/plugInfo.json" \
            "$P/lib/cmake/rigExec/rigExecConfig.cmake" \
            "$P/include/rigExec/rigEvaluator.h"
          do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          test -e "$P/lib/librigExecMath.a" || test -e "$P/lib/librigExecMath.so" \
            || { echo "missing: $P/lib/librigExecMath.{a,so}"; exit 1; }

      - name: Validate installed plugInfo.json files (python3)
        run: |
          python3 - "$GITHUB_WORKSPACE/usdrig-install" <<'PY'
          import json, os, sys

          prefix = os.path.abspath(sys.argv[1])
          failures = []

          def check(cond, msg):
              print(("ok:   " if cond else "FAIL:  ") + msg)
              if not cond:
                  failures.append(msg)

          def load_pluginfo(path, name):
              with open(path) as f:
                  lines = [l for l in f.readlines() if not l.lstrip().startswith("#")]
              data = json.loads("".join(lines))
              for p in data.get("Plugins", []):
                  if p.get("Name") == name:
                      return p
              return None

          def resolved_library(plug, pluginfo_path):
              root = os.path.normpath(
                  os.path.join(os.path.dirname(pluginfo_path), plug.get("Root", ".")))
              return os.path.normpath(os.path.join(root, plug.get("LibraryPath", "")))

          schema_pluginfo = os.path.join(
              prefix, "lib", "usd", "rigExecSchema", "resources", "plugInfo.json")
          imaging_pluginfo = os.path.join(
              prefix, "lib", "usd", "rigExecImaging", "resources", "plugInfo.json")

          s = load_pluginfo(schema_pluginfo, "rigExecSchema")
          check(s is not None, "schema plugInfo: rigExecSchema plugin entry present")
          if s:
              check(s.get("Type") == "library", "schema plugInfo: Type == 'library'")
              lib = resolved_library(s, schema_pluginfo)
              check(os.path.isfile(lib),
                    "schema plugInfo: LibraryPath resolves to an existing library (%s)" % lib)
              types = s.get("Info", {}).get("Types", {})
              check("RigExecRoot" in types, "schema plugInfo: RigExecRoot present")

          i = load_pluginfo(imaging_pluginfo, "rigExecImaging")
          check(i is not None, "imaging plugInfo: rigExecImaging plugin entry present")
          if i:
              check(i.get("Type") == "library", "imaging plugInfo: Type == 'library'")
              lib = resolved_library(i, imaging_pluginfo)
              check(lib == os.path.join(prefix, "lib", "librigExecImaging.so"),
                    "imaging plugInfo: LibraryPath resolves to installed librigExecImaging.so (%s)" % lib)
              check(os.path.isfile(lib), "imaging plugInfo: resolved library exists")
              types = i.get("Info", {}).get("Types", {})
              check("RigExecUsdImagingSceneIndexPlugin" in types,
                    "imaging plugInfo: RigExecUsdImagingSceneIndexPlugin present")

          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nall plugInfo checks passed")
          PY

      - name: Build and run installed scene and oracle consumers
        run: |
          cmake -S tests/installedScene -B installed-scene-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usdrig-install;${GITHUB_WORKSPACE}/usd-install"
          cmake --build installed-scene-build --parallel 2
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          ctest --test-dir installed-scene-build --output-on-failure


  platform-cpp:
    name: Release C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            jobs: 4
          - os: macos-15
            jobs: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Checkout OpenUSD
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          path: OpenUSD

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install "cmake>=3.26,<4" ninja

      - name: OpenUSD commit
        id: usd
        shell: bash
        run: echo "sha=$(git -C OpenUSD rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Windows toolchain identity
        if: runner.os == 'Windows'
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $version = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: macOS toolchain identity
        if: runner.os == 'macOS'
        id: xcode
        shell: bash
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache OpenUSD
        id: usd-cache
        uses: actions/cache@v4
        with:
          path: usd-install
          key: openusd-${{ matrix.os }}-${{ runner.arch }}-${{ steps.usd.outputs.sha }}-${{ steps.msvc.outputs.version }}${{ steps.xcode.outputs.version }}-exec-imaging-nopy-v1

      - name: Build OpenUSD on Windows
        if: runner.os == 'Windows' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          python OpenUSD\build_scripts\build_usd.py usd-install --build usd-build --generator Ninja --build-variant release --jobs ${{ matrix.jobs }} --usd-imaging --no-usdview --no-python --no-tests --no-examples --no-tutorials --no-docs --no-materialx --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Build OpenUSD on macOS
        if: runner.os == 'macOS' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python OpenUSD/build_scripts/build_usd.py usd-install \
            --build usd-build --generator Ninja --build-variant release \
            --jobs ${{ matrix.jobs }} --usd-imaging --no-usdview --no-python \
            --no-tests --no-examples --no-tutorials --no-docs --no-materialx \
            --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          set "USD=%GITHUB_WORKSPACE%\usd-install"
          call bin\_env.bat
          set "PXR_PLUGINPATH_NAME=%GITHUB_WORKSPACE%\build\usd\rigExecSchema\resources;%GITHUB_WORKSPACE%\build\usd\rigExecImaging\resources;%GITHUB_WORKSPACE%\build\usd\rigExecMoverPlugins"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSD_INSTALL_DIR="%USD%" -DCMAKE_PREFIX_PATH="%USD%" -DRIGEXEC_BUILD_PYTHON=OFF -DRIGEXEC_BUILD_USDNOODLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build --parallel ${{ matrix.jobs }} -- -k 0
          if errorlevel 1 exit /b 1
          ctest --test-dir build --parallel ${{ matrix.jobs }} --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
          cmake --install build --prefix "%GITHUB_WORKSPACE%/usdrig-install"
          if errorlevel 1 exit /b 1
          cmake -S tests/installedScene -B installed-scene-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/usdrig-install;%USD%"
          if errorlevel 1 exit /b 1
          cmake --build installed-scene-build --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir installed-scene-build --output-on-failure

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export USD="$GITHUB_WORKSPACE/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="$USD" -DCMAKE_PREFIX_PATH="$USD" \
            -DRIGEXEC_BUILD_PYTHON=OFF -DRIGEXEC_BUILD_USDNOODLES=OFF
          cmake --build build --parallel ${{ matrix.jobs }}
          ctest --test-dir build \
            --parallel ${{ matrix.jobs }} --output-on-failure --no-tests=error
          cmake --install build --prefix "$GITHUB_WORKSPACE/usdrig-install"
          cmake -S tests/installedScene -B installed-scene-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/usdrig-install;$USD"
          cmake --build installed-scene-build --parallel 2
          ctest --test-dir installed-scene-build --output-on-failure

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ runner.arch }}
          path: |
            build/Testing/Temporary/
            build/CMakeFiles/CMakeConfigureLog.yaml
            installed-scene-build/Testing/Temporary/
            usd-build/**/log.txt
