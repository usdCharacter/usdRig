# Release C++ coverage on Linux, Windows and macOS. Python and usdview run
# headless for the usdNoodles and Assistant jobs; the remaining interactive
# graphics stay workstation checks. Cache unchanged OpenUSD
# separately from the project; retain test logs even when CTest fails.

name: usdRig

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: usdrig-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hidden-locks:
    name: no new hidden locks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Scan parallel-lane sources
        run: python3 tools/check_hidden_locks.py

  internal-includes:
    name: no new rigExec internal includes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Scan includes of rigExec/internal
        run: python3 tools/check_internal_includes.py

  allocations:
    name: no new bare new
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Scan owned sources for bare allocation
        run: python3 tools/check_allocations.py

  pxr-libraries:
    name: no dropped OpenUSD libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Scan links, includes and imports
        run: |
          python3 tools/check_pxr_libraries.py --self-test
          python3 tools/check_pxr_libraries.py

  # --------------------------------------------------------------------------
  # Offline audit of the checkout's legal layer: the manifest must partition
  # the tracked tree exactly once, every legal text it names must exist and be
  # current, the install map must match CMake's legal install entries, and both
  # shipped tutorial archives must carry their mapped members. Stdlib-only and
  # offline (git ls-files plus the checked-in archives), so it needs no OpenUSD
  # prefix and no build tree. Add-on-bound sources are notes until an
  # --addon-root is supplied; a tree with no git reports the partition as
  # unverifiable rather than passing.
  # --------------------------------------------------------------------------
  licenses:
    name: license manifest and legal texts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Audit the checkout manifest, texts and archives
        run: python3 tools/check_licenses.py

  runtime-usd-free:
    name: runtime compiles without OpenUSD
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 45
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install a compiler
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends g++

      # The check compiles the configured runtime sources (including the
      # generated mover kernels) from this checkout, so it needs the
      # build tree's source manifests.
      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract build tree
        run: |
          mkdir -p build
          tar -C build -xf usdrig-build.tar

      - name: Compile the runtime with no pxr include path
        run: bin/check_runtime_usd_free.sh

      # The include manifests are compile inputs for every unit the source
      # manifests name, C units included. A .c unit that reaches a header only
      # present in an include-manifest directory must compile and get its own
      # object from a configured build tree.
      - name: Compile a manifest-listed .c unit through a build-tree include manifest
        run: |
          mkdir -p build-c runtime-probe-c/headers
          cp build/runtimeSources.txt build/runtimeIncludes.txt \
             build/evalCoreSources.txt build/evalCoreIncludes.txt \
             build/opCoreSources.txt build/exactFpFlags.txt build-c/
          printf '%s\n' '#ifndef RIGEXEC_MANIFEST_C_PROBE_H' \
            '#define RIGEXEC_MANIFEST_C_PROBE_H 4271' '#endif' \
            > runtime-probe-c/headers/rigExecManifestCProbe.h
          printf '%s\n' '#include "rigExecManifestCProbe.h"' \
            'int RigExecManifestCProbe(void){ return RIGEXEC_MANIFEST_C_PROBE_H; }' \
            > runtime-probe-c/probe_c_unit.c
          sed -i '1i runtime-probe-c/probe_c_unit.c' build-c/runtimeSources.txt
          sed -i '1i runtime-probe-c/headers' build-c/runtimeIncludes.txt
          bin/check_runtime_usd_free.sh build-c --list-objects \
            | tee build-c-objects.txt
          grep -F 'object: runtime-probe-c@probe_c_unit.c.o' build-c-objects.txt \
            >/dev/null || { echo "the manifest-listed .c unit has no object target"; exit 1; }
          sed -i '\|^runtime-probe-c/headers$|d' build-c/runtimeIncludes.txt
          if bin/check_runtime_usd_free.sh build-c > build-c-noinclude.log 2>&1; then
            echo "the .c unit compiled without the include directory the manifest names"
            exit 1
          fi
          grep -F "rigExecManifestCProbe.h" build-c-noinclude.log >/dev/null \
            || { echo "the failure did not name the header only the include manifest supplies"
                 cat build-c-noinclude.log; exit 1; }
          echo "build-tree mode: the .c unit needs and gets the manifest include directory"

      # The positional build-directory interface must keep working when the
      # tree is not named build/: the manifests there carry the absolute and
      # checkout-relative spellings CMake wrote, unlike installed manifests.
      # Moving the manifests (generated sources stay in place) also makes the
      # check fail if the checker ever ignores the positional directory, so it
      # runs last and the steps above still see the tree CMake wrote.
      - name: Compile from a nondefault configured build directory
        run: |
          mkdir -p runtime-build-alt
          mv build/runtimeSources.txt build/runtimeIncludes.txt \
             build/evalCoreSources.txt build/evalCoreIncludes.txt \
             build/opCoreSources.txt build/exactFpFlags.txt runtime-build-alt/
          bin/check_runtime_usd_free.sh runtime-build-alt

  # --------------------------------------------------------------------------
  # OpenUSD v26.08 (PixarAnimationStudios/OpenUSD @ tag v26.08).
  # Cache key = OS + arch + resolved commit + recipe epoch. Bump the epoch
  # ("exec-usdimg-gl-nopy-v1" -> "...-v2") whenever the build_usd.py
  # invocation changes so two prefixes from the same commit with different
  # options never alias.
  # --------------------------------------------------------------------------
  openusd:
    name: OpenUSD v26.08
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      openusd-sha: ${{ steps.openusd-sha.outputs.sha }}
    steps:
      - name: Checkout OpenUSD @ v26.08
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          fetch-depth: 1

      - name: OpenUSD commit (cache key)
        id: openusd-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-setuptools \
            libglew-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev xorg-dev ninja-build

      - name: Restore cached OpenUSD install prefix
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-nopy-v1

      - name: Build OpenUSD (Release, Ninja, imaging, OpenExec)
        # build_scripts/build_usd.py is the v26.08 entry point.
        # --usd-imaging     -> PXR_BUILD_IMAGING=ON + PXR_BUILD_USD_IMAGING=ON
        # --no-usdview      -> skip PySide/PyOpenGL
        # --no-python       -> first-gate prefix: C++ tests do not need pxr
        #                      Python bindings.
        # --no-materialx    -> drop MaterialX
        # --build-args USD  -> keep OpenExec on even if a later OpenUSD
        #                      default flips (PXR_BUILD_EXEC is ON in 26.08)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 build_scripts/build_usd.py \
            usd-install \
            --build usd-build \
            --generator Ninja \
            --build-variant release \
            --jobs 4 \
            --usd-imaging \
            --no-usdview \
            --no-python \
            --no-tests --no-examples --no-tutorials --no-docs \
            --no-materialx \
            --build-args USD,"-DPXR_BUILD_EXEC=ON" \
            -v

      - name: Drop OpenUSD build tree
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf usd-build

      - name: Save OpenUSD install prefix to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-nopy-v1

      - name: Sanity - libraries usdRig links are present
        run: |
          for lib in \
            libusd_usd.so libusd_tf.so libusd_sdf.so libusd_gf.so \
            libusd_arch.so libusd_vt.so libusd_plug.so libusd_work.so \
            libusd_usdGeom.so libusd_usdUtils.so \
            libusd_usdImaging.so libusd_hd.so \
            libusd_exec.so libusd_execUsd.so libusd_ef.so \
            libusd_vdf.so libusd_esf.so libusd_esfUsd.so
          do
            test -e "usd-install/lib/$lib" || { echo "missing usd-install/lib/$lib"; exit 1; }
          done
          test -d usd-install/plugin/usd
          test -e usd-install/pxrConfig.cmake \
            || test -e usd-install/lib/cmake/pxr/pxrConfig.cmake \
            || { echo "missing pxrConfig.cmake under usd-install"; exit 1; }

      - name: Pack OpenUSD prefix as tarball
        run: tar -C usd-install -cf usd-install.tar .

      - name: Upload OpenUSD prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: usd-install.tar
          path: usd-install.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # The same OpenUSD v26.08 commit as `openusd`, with Python bindings and
  # usdview, for the usdNoodles scenario suite. Distinct cache key (py-usdview)
  # and distinct artifact name so the two prefixes never alias, and the C++
  # jobs keep configuring against the no-Python prefix.
  #
  # build_usd.py builds usdview only when the interpreter running it already
  # imports PySide and PyOpenGL and finds pyside6-uic on PATH -- it refuses to
  # install PySide itself -- so both go into a venv that also runs the build.
  # --------------------------------------------------------------------------
  openusd-py:
    name: OpenUSD v26.08 (Python + usdview)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout OpenUSD @ v26.08
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          fetch-depth: 1

      - name: OpenUSD commit (cache key)
        id: openusd-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev python3-setuptools \
            libglew-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev \
            libgl1-mesa-dev xorg-dev ninja-build

      - name: Restore cached OpenUSD install prefix
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-py-usdview-v1

      - name: Python environment with PySide6 and PyOpenGL
        # Only the build step needs it, so a cache hit skips the download.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv usd-venv
          usd-venv/bin/python -m pip install --disable-pip-version-check \
            PySide6 PyOpenGL

      - name: Build OpenUSD (Release, Ninja, imaging, OpenExec, Python, usdview)
        # Only --no-python and --no-usdview differ from the `openusd` recipe;
        # pyside6-uic must be on PATH or build_usd.py skips usdview.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="${GITHUB_WORKSPACE}/usd-venv/bin:$PATH"
          usd-venv/bin/python build_scripts/build_usd.py \
            usd-install \
            --build usd-build \
            --generator Ninja \
            --build-variant release \
            --jobs 4 \
            --usd-imaging \
            --no-tests --no-examples --no-tutorials --no-docs \
            --no-materialx \
            --build-args USD,"-DPXR_BUILD_EXEC=ON" \
            -v

      - name: Drop OpenUSD build tree
        if: steps.cache.outputs.cache-hit != 'true'
        run: rm -rf usd-build

      - name: Save OpenUSD install prefix to cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd-install
          key: openusd-${{ runner.os }}-${{ runner.arch }}-${{ steps.openusd-sha.outputs.sha }}-exec-usdimg-gl-py-usdview-v1

      - name: Sanity - usdview and its python modules are present
        run: |
          test -e usd-install/bin/usdview \
            || { echo "missing usd-install/bin/usdview"; exit 1; }
          test -e usd-install/bin/testusdview \
            || { echo "missing usd-install/bin/testusdview"; exit 1; }
          ls -d usd-install/lib/python*/site-packages/pxr/Usdviewq \
            || { echo "missing pxr.Usdviewq in the prefix"; exit 1; }
          ls -d usd-install/lib/python*/site-packages/pxr/Usd \
            || { echo "missing pxr.Usd python bindings in the prefix"; exit 1; }

      - name: Pack OpenUSD prefix as tarball
        run: tar -C usd-install -cf usd-install-py.tar .

      - name: Upload OpenUSD prefix tarball
        uses: actions/upload-artifact@v4
        with:
          name: usd-install-py.tar
          path: usd-install-py.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Configure only. Proves find_package(pxr) + the first-gate cache vars
  # against a clean runner. FETCHCONTENT is unused while usdNoodles is off,
  # so this is already an offline configure.
  # --------------------------------------------------------------------------
  configure:
    name: configure
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 20
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install configure dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF

  # --------------------------------------------------------------------------
  # Release build + rigExecPose smoke on the smallest shipped rig.
  # --------------------------------------------------------------------------
  build-release:
    name: usdRig build (Release)
    runs-on: ubuntu-24.04
    needs: openusd
    timeout-minutes: 90
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF

      - name: Build
        run: ninja -C build -j"$(nproc)"

      - name: rigExecPose smoke
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          "${GITHUB_WORKSPACE}/build/rigExecPose" \
            "${GITHUB_WORKSPACE}/examples/rigexec_flat.usda" \
            --frames 0,50,100 --joints

      - name: Pack build tree
        run: tar -C build -cf usdrig-build.tar .

      - name: Upload build tree
        uses: actions/upload-artifact@v4
        with:
          name: usdrig-build.tar
          path: usdrig-build.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Full configured CTest suite, including cone verification and example
  # parity, in three shards: shard k runs tests k, k+3, k+6, ... in
  # registration order (ctest -I), so together they run every test once, plus
  # the FIXTURES_SETUP tests a shard's tests require. Name and label filters
  # are reserved for local focused runs.
  # --------------------------------------------------------------------------
  ctest-cpp-shard:
    name: ctest (full suite, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract
        run: |
          mkdir -p usd-install build
          tar -C usd-install -xf usd-install.tar
          tar -C build -xf usdrig-build.tar

      # Imaging and GPU test binaries link OpenGL at load time through
      # garch, so this fresh runner needs the same GL/X11 closure the
      # build jobs installed.
      - name: Install test runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev

      - name: Run CTest shard
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          ctest --test-dir build \
            -I ${{ matrix.shard }},,3 \
            -j"$(nproc)" \
            --output-on-failure --no-tests=error

      # Re-records this shard's exec-row goldens from the production evaluator
      # into build/execRows, the set a deliberate row change checks in for
      # this configuration (tests/fixtures/README.md).
      - name: Record exec-row goldens
        if: ${{ !cancelled() }}
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          touch build/execRows.stamp
          RIGEXEC_RECORD_EXEC_ROWS=1 ctest --test-dir build \
            -I ${{ matrix.shard }},,3 -R '^testRigExecExecGoldens_' \
            -j"$(nproc)" --output-on-failure
          mkdir -p build/execRows
          find tests/fixtures/execRows -name '*.golden' \
            -newer build/execRows.stamp -exec cp {} build/execRows/ \;

      - name: Upload exec cross-check rows
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: exec-rows-linux-shard${{ matrix.shard }}
          path: build/execRows/
          retention-days: 5

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-linux-shard${{ matrix.shard }}
          path: |
            build/Testing/Temporary/
            build/verify-binary/*.log

  # The shards' verdict under the suite's single check name, and their exec
  # cross-check rows merged into the one exec-rows-linux artifact.
  ctest-cpp:
    name: ctest (full suite)
    runs-on: ubuntu-24.04
    needs: [build-release, ctest-cpp-shard]
    if: ${{ !cancelled() && needs.build-release.result == 'success' }}
    timeout-minutes: 10
    steps:
      - name: Download exec cross-check rows
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: exec-rows-linux-shard*
          path: execRows
          merge-multiple: true

      - name: Exec cross-check rows configuration
        run: |
          mkdir -p execRows
          find execRows -name '*.golden' | wc -l
          cat /dev/null execRows/*.golden 2>/dev/null |
            grep -o 'reference=[^ ]*' | sort -u || true

      - name: Upload exec cross-check rows
        uses: actions/upload-artifact@v4
        with:
          name: exec-rows-linux
          path: execRows/
          if-no-files-found: warn

      - name: CTest shards passed
        if: always()
        run: test "${{ needs.ctest-cpp-shard.result }}" = success

  # --------------------------------------------------------------------------
  # The usdNoodles scenario suite (plugin/usdNoodles/testenv) plus the four
  # headless editor drivers. plugin/ is pruned from the change selector, so no
  # other job reaches this code: --no-tests=error turns a missing testUsdNoodles
  # registration into a failure instead of a silent skip.
  # --------------------------------------------------------------------------
  usdnoodles-suite:
    name: usdNoodles scenario suite
    runs-on: ubuntu-24.04
    needs: openusd-py
    timeout-minutes: 90
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      # The build-release set, plus python3-dev for the _rigexec bindings that
      # -DRIGEXEC_BUILD_PYTHON=ON configures, plus xvfb for the editor drivers.
      # The PySide6 wheel carries its own Qt but links the system's XCB and
      # xkbcommon libraries, so the xcb platform plugin is unloadable -- and
      # every driver aborts before usdview starts -- without this set. They are
      # what `ldd` reports unresolved for that plugin on this image.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev python3-dev xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libglib2.0-0t64 \
            libdbus-1-3

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-noodles-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-noodles-${{ runner.os }}-

      # CTest runs the suite with CMake's Python3, so that interpreter is the
      # one that needs PySide6 and PyOpenGL. numpy is for the editor drivers,
      # pybind11 for the RigExec Python bindings.
      - name: Python environment for the suite
        run: |
          python3 -m venv noodles-venv
          noodles-venv/bin/python -m pip install --disable-pip-version-check \
            PySide6 PyOpenGL numpy pybind11

      - name: Probe the Qt session the drivers need
        run: |
          py="${GITHUB_WORKSPACE}/noodles-venv/bin/python"
          plugins="$("$py" -c 'import os, PySide6; print(os.path.join(os.path.dirname(PySide6.__file__), "Qt", "plugins", "platforms"))')"
          missing="$(ldd "$plugins/libqxcb.so" \
            | sed -n 's/[[:space:]]*\(.*\.so[^ ]*\) => not found$/\1/p' | sort -u)"
          if [ -n "$missing" ]; then
            echo "FAIL: the Qt xcb platform plugin cannot resolve:"
            echo "$missing"
            exit 1
          fi
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            "$py" -c 'import sys; from PySide6.QtWidgets import QApplication; app = QApplication([]); print("qt platform:", app.platformName()); sys.exit(app.platformName() != "xcb")'

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install-py.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install-py.tar

      - name: Check usdview menu contract
        run: |
          export USD="$GITHUB_WORKSPACE/usd-install"
          export VENV="$GITHUB_WORKSPACE/noodles-venv"
          export QT_QPA_PLATFORM=offscreen
          source bin/_env.sh
          "$PY" tests/python/test_usdview_menu.py

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/noodles-venv/bin/python3" \
            -DRIGEXEC_BUILD_PYTHON=ON \
            -DRIGEXEC_BUILD_USDNOODLES=ON \
            -DRIGEXEC_BUILD_TESTS=ON

      # rigExecImaging is not part of the editor; the drivers load it through
      # the plugin path bin/_env.sh exports, and usdview fails its Tf error
      # check when the named plugin library is missing.
      - name: Build the staged editor
        run: |
          cmake --build build -j"$(nproc)" \
            --target usdNoodlesLib _usdNoodles usdNoodles_python_package rigExecImaging

      - name: Run the scenario suite
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          export VENV="${GITHUB_WORKSPACE}/noodles-venv"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          ctest --test-dir build -R '^testUsdNoodles$' \
            --output-on-failure --no-tests=error

      # GraphView's widget (usdview's QGLWidget, QOpenGLWidget under PySide6)
      # is unsupported on the Qt offscreen platform, so the drivers get a GLX
      # display and Mesa software rendering. The .sh drivers are checked in
      # without the executable bit.
      - name: Run the usdview editor drivers
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          export VENV="${GITHUB_WORKSPACE}/noodles-venv"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          export LIBGL_ALWAYS_SOFTWARE=1
          status=0
          for driver in rename values icons touch; do
            case "$driver" in
              rename) marker=RIGEXEC_NOODLES_RENAME_OK ;;
              values) marker=RIGEXEC_NOODLES_VALUES_OK ;;
              icons)  marker=RIGEXEC_NOODLES_ICONS_OK ;;
              touch)  marker=RIGEXEC_NOODLES_TOUCH_OK ;;
            esac
            log="noodles-driver-${driver}.log"
            rc=0
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              bash "bin/test/run_testusdview_noodles_${driver}.sh" \
              > "$log" 2>&1 || rc=$?
            if [ "$rc" -ne 0 ] || ! grep -q "$marker" "$log"; then
              echo "FAIL: run_testusdview_noodles_${driver}.sh (exit ${rc}, no ${marker})"
              tail -n 40 "$log"
              status=1
            else
              echo "ok: ${marker}"
            fi
          done
          exit $status

      - name: Upload suite and driver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usdnoodles-suite
          path: |
            build/Testing/Temporary/
            noodles-driver-*.log

  # --------------------------------------------------------------------------
  # Assistant coverage: the two headless Assistant suites, and the live
  # usdview driver that runs Assistant replies, their undo steps, and the
  # stage fence against the real host. plugin/ is pruned from the change
  # selector, so no other job reaches this code. The driver needs the
  # Python bindings and the imaging plugin, so this tree builds the editor
  # with RIGEXEC_BUILD_PYTHON=ON; the C++ tests stay with build-release.
  # --------------------------------------------------------------------------
  assistant-suite:
    name: Assistant suites + usdview driver
    runs-on: ubuntu-24.04
    needs: openusd-py
    timeout-minutes: 90
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      # The same set the usdNoodles job installs: the Qt xcb platform plugin
      # is unloadable without the system XCB libraries, and xvfb plus Mesa
      # give the driver a GLX display.
      - name: Install build and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libgl1-mesa-dev xorg-dev python3-dev xvfb \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libglib2.0-0t64 \
            libdbus-1-3

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-assistant-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-assistant-${{ runner.os }}-

      - name: Python environment for the suites
        run: |
          python3 -m venv assistant-venv
          assistant-venv/bin/python -m pip install --disable-pip-version-check \
            PySide6 PyOpenGL numpy pybind11

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install-py.tar

      - name: Extract OpenUSD prefix
        run: |
          mkdir -p usd-install
          tar -C usd-install -xf usd-install-py.tar

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DPython3_EXECUTABLE="${GITHUB_WORKSPACE}/assistant-venv/bin/python3" \
            -DRIGEXEC_BUILD_PYTHON=ON \
            -DRIGEXEC_BUILD_TESTS=OFF

      - name: Build the editor and Python bindings
        run: cmake --build build -j"$(nproc)"

      # The panel suites import Qt, so they run on the offscreen platform;
      # they never open a window or a GL context.
      - name: Run the Assistant suites
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          export VENV="${GITHUB_WORKSPACE}/assistant-venv"
          export QT_QPA_PLATFORM=offscreen
          source bin/_env.sh
          bash bin/test/run_python_tests.sh test_assistant test_assistant_panel_undo

      # GraphView's widget is unsupported on the Qt offscreen platform, so
      # the driver gets a GLX display and Mesa software rendering.
      - name: Run the Assistant usdview driver
        run: |
          export USD="${GITHUB_WORKSPACE}/usd-install"
          export VENV="${GITHUB_WORKSPACE}/assistant-venv"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          export LIBGL_ALWAYS_SOFTWARE=1
          log=assistant-driver.log
          rc=0
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            bash bin/test/run_testusdview_assistant.sh > "$log" 2>&1 || rc=$?
          if [ "$rc" -ne 0 ] || ! grep -q RIGEXEC_ASSISTANT_OK "$log"; then
            echo "FAIL: run_testusdview_assistant.sh (exit ${rc}, no RIGEXEC_ASSISTANT_OK)"
            tail -n 40 "$log"
            exit 1
          fi
          echo "ok: RIGEXEC_ASSISTANT_OK"

      - name: Upload driver log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-suite
          path: assistant-driver.log

  # --------------------------------------------------------------------------
  # Install tree: cmake --install into a scratch prefix, then verify the
  # layout the README documents (lib/, lib/usd/<plugin>/resources/,
  # include/, lib/cmake/rigExec).
  # --------------------------------------------------------------------------
  install-check:
    name: usdRig install layout + plugInfo
    runs-on: ubuntu-24.04
    needs: build-release
    timeout-minutes: 20
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Install consumer build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev

      - name: Download OpenUSD prefix
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Download build tree
        uses: actions/download-artifact@v4
        with:
          name: usdrig-build.tar

      - name: Extract
        run: |
          mkdir -p usd-install build
          tar -C usd-install -xf usd-install.tar
          tar -C build -xf usdrig-build.tar

      - name: Install into scratch prefix
        run: cmake --install build --prefix "${GITHUB_WORKSPACE}/usdrig-install"

      # Runs only after the real install: every mapped legal text must have
      # landed under share/rigExec current against its source, and the shipped
      # notice's links must reach members of this prefix. The usdNoodles texts
      # are installed whether or not the editor was built, so the noodles-off
      # prefix still carries them.
      - name: Check legal texts in the installed prefix
        run: python3 tools/check_licenses.py --install "${GITHUB_WORKSPACE}/usdrig-install"

      - name: Verify installed layout
        run: |
          P="${GITHUB_WORKSPACE}/usdrig-install"
          for f in \
            "$P/lib/librigExec.so" \
            "$P/lib/librigExecOpCore.so" \
            "$P/lib/librigExecScene.so" \
            "$P/lib/librigExecOracle.so" \
            "$P/lib/librigExecImaging.so" \
            "$P/lib/python/usdRigViewMenu.py" \
            "$P/lib/librigExecAuthoring.so" \
            "$P/lib/usd/rigExecSchema/resources/plugInfo.json" \
            "$P/lib/usd/rigExecSchema/resources/generatedSchema.usda" \
            "$P/lib/usd/rigExecImaging/resources/plugInfo.json" \
            "$P/lib/cmake/rigExec/rigExecConfig.cmake" \
            "$P/lib/cmake/rigExec/rigexec_flags.cmake" \
            "$P/share/rigExec/exactFpFlags.txt" \
            "$P/share/rigExec/runtimeSources.txt" \
            "$P/share/rigExec/runtimeIncludes.txt" \
            "$P/share/rigExec/evalCoreSources.txt" \
            "$P/share/rigExec/evalCoreIncludes.txt" \
            "$P/share/rigExec/opCoreSources.txt" \
            "$P/include/rigExec/api/rigEvaluator.h"
          do
            test -e "$f" || { echo "missing: $f"; exit 1; }
          done
          test -e "$P/lib/librigExecMath.a" || test -e "$P/lib/librigExecMath.so" \
            || { echo "missing: $P/lib/librigExecMath.{a,so}"; exit 1; }

      - name: Install into a DESTDIR staging tree
        run: |
          DESTDIR="$GITHUB_WORKSPACE/stage" cmake --install build --prefix "$GITHUB_WORKSPACE/unstaged-prefix"
          S="$GITHUB_WORKSPACE/stage/$GITHUB_WORKSPACE/unstaged-prefix/share/rigExec"
          for f in \
            exactFpFlags.txt \
            runtimeSources.txt \
            runtimeIncludes.txt \
            evalCoreSources.txt \
            evalCoreIncludes.txt \
            opCoreSources.txt \
            runtime-generated/moverCatalog.cpp
          do
            test -e "$S/$f" || { echo "missing from staging tree: $S/$f"; exit 1; }
          done
          ls "$S"
          test -e "$GITHUB_WORKSPACE/unstaged-prefix" \
            && { echo "staged install wrote into the unstaged prefix $GITHUB_WORKSPACE/unstaged-prefix"; exit 1; }
          python3 tools/check_licenses.py --install "$GITHUB_WORKSPACE/stage/$GITHUB_WORKSPACE/unstaged-prefix"

      # RIGEXEC_INSTALL_CMAKEDIR and RIGEXEC_INSTALL_DATADIR move the package
      # file and the manifest set together. Install a second prefix with both
      # spelled differently: the consumer's SConstruct must reach the manifests
      # through the package file wherever it sits, not through the default
      # lib/cmake/rigExec location.
      - name: Install with a non-default package and data layout
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_INSTALL_CMAKEDIR="cmake/rigExec-alt" \
            -DRIGEXEC_INSTALL_DATADIR="sdk data"
          cmake --install build --prefix "${GITHUB_WORKSPACE}/usdrig-install-alt"
          A="${GITHUB_WORKSPACE}/usdrig-install-alt"
          for f in "cmake/rigExec-alt/rigExecConfig.cmake" \
                   "sdk data/exactFpFlags.txt" \
                   "sdk data/runtimeSources.txt" \
                   "sdk data/runtimeIncludes.txt" \
                   "sdk data/evalCoreSources.txt" \
                   "sdk data/evalCoreIncludes.txt" \
                   "sdk data/opCoreSources.txt" \
                   "sdk data/runtime-generated/moverCatalog.cpp"
          do
            test -f "$A/$f" || { echo "missing from the alt layout: $A/$f"; exit 1; }
          done
          test ! -e "$A/lib/cmake/rigExec/rigExecConfig.cmake" \
            || { echo "the configured cmake directory was ignored"; exit 1; }
          python3 tools/check_licenses.py --install "$A"
          tar -C "$A" -cf usdrig-sdk-alt.tar "cmake/rigExec-alt" "sdk data"

      - name: Upload the non-default-layout SDK data
        uses: actions/upload-artifact@v4
        with:
          name: usdrig-sdk-alt.tar
          path: usdrig-sdk-alt.tar
          retention-days: 5

      - name: Validate installed plugInfo.json files (python3)
        run: |
          python3 - "$GITHUB_WORKSPACE/usdrig-install" <<'PY'
          import json, os, sys

          prefix = os.path.abspath(sys.argv[1])
          failures = []

          def check(cond, msg):
              print(("ok:   " if cond else "FAIL:  ") + msg)
              if not cond:
                  failures.append(msg)

          def load_pluginfo(path, name):
              with open(path) as f:
                  lines = [l for l in f.readlines() if not l.lstrip().startswith("#")]
              data = json.loads("".join(lines))
              for p in data.get("Plugins", []):
                  if p.get("Name") == name:
                      return p
              return None

          def resolved_library(plug, pluginfo_path):
              root = os.path.normpath(
                  os.path.join(os.path.dirname(pluginfo_path), plug.get("Root", ".")))
              return os.path.normpath(os.path.join(root, plug.get("LibraryPath", "")))

          schema_pluginfo = os.path.join(
              prefix, "lib", "usd", "rigExecSchema", "resources", "plugInfo.json")
          imaging_pluginfo = os.path.join(
              prefix, "lib", "usd", "rigExecImaging", "resources", "plugInfo.json")

          s = load_pluginfo(schema_pluginfo, "rigExecSchema")
          check(s is not None, "schema plugInfo: rigExecSchema plugin entry present")
          if s:
              check(s.get("Type") == "library", "schema plugInfo: Type == 'library'")
              lib = resolved_library(s, schema_pluginfo)
              check(os.path.isfile(lib),
                    "schema plugInfo: LibraryPath resolves to an existing library (%s)" % lib)
              types = s.get("Info", {}).get("Types", {})
              check("RigExecRoot" in types, "schema plugInfo: RigExecRoot present")

          i = load_pluginfo(imaging_pluginfo, "rigExecImaging")
          check(i is not None, "imaging plugInfo: rigExecImaging plugin entry present")
          if i:
              check(i.get("Type") == "library", "imaging plugInfo: Type == 'library'")
              lib = resolved_library(i, imaging_pluginfo)
              check(lib == os.path.join(prefix, "lib", "librigExecImaging.so"),
                    "imaging plugInfo: LibraryPath resolves to installed librigExecImaging.so (%s)" % lib)
              check(os.path.isfile(lib), "imaging plugInfo: resolved library exists")
              types = i.get("Info", {}).get("Types", {})
              check("RigExecUsdImagingSceneIndexPlugin" in types,
                    "imaging plugInfo: RigExecUsdImagingSceneIndexPlugin present")

          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nall plugInfo checks passed")
          PY

      - name: Build and run installed scene and oracle consumers
        run: |
          cmake -S tests/installedScene -B installed-scene-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usdrig-install;${GITHUB_WORKSPACE}/usd-install"
          cmake --build installed-scene-build --parallel 2
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          ctest --test-dir installed-scene-build --output-on-failure

      # The declared cmake_minimum_required floor, checked in a throwaway venv
      # so the steps above keep the runner's cmake.
      - name: Staging test at the declared minimum CMake
        run: |
          python3 -m venv /tmp/cm326
          /tmp/cm326/bin/pip install --disable-pip-version-check "cmake==3.26.*"
          /tmp/cm326/bin/cmake --version
          /tmp/cm326/bin/cmake -S . -B build-326 -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_TESTS=ON \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF
          /tmp/cm326/bin/cmake --build build-326 --target rigexecSdkManifests
          export USD="${GITHUB_WORKSPACE}/usd-install"
          source bin/_env.sh
          /tmp/cm326/bin/ctest --test-dir build-326 -R 'testRigExec(InstallStaging|ExactFpFragment)' --output-on-failure
      # The relocated-consumer job rebuilds from these installed files alone:
      # the share/rigExec manifests with their runtime-generated payload, the
      # exact-FP flags fragment the SConstruct reads, and the package file that
      # names the data directory. No build tree, no generated objects, no
      # producer path travels with them.
      - name: Pack installed SDK data for the relocated consumer
        run: |
          tar -C "${GITHUB_WORKSPACE}/usdrig-install" -cf usdrig-sdk-data.tar \
            share/rigExec lib/cmake/rigExec/rigexec_flags.cmake \
            lib/cmake/rigExec/rigExecConfig.cmake

      - name: Upload installed SDK data
        uses: actions/upload-artifact@v4
        with:
          name: usdrig-sdk-data.tar
          path: usdrig-sdk-data.tar
          retention-days: 5

  # --------------------------------------------------------------------------
  # Relocated SDK consumer: a clean Linux checkout that has never seen the
  # producer build tree compiles the installed manifests from the real
  # install-check above. It checks out the same commit under a different
  # directory name, asserts the producer's checkout, build and prefix paths
  # hold nothing here, and downloads no build artifact. The USD-free shell
  # check runs against the relocated manifest directory, and against a copy
  # whose manifest adds a .cxx unit; then the actual tutorial archive builds
  # both Godot template configurations in one output tree against the
  # relocated SDK, and the in-place SCons path is enumerated against a
  # configured build with no SDK. The SCons manifest contract is checked at
  # parse level: an incomplete manifest set is refused instead of completed
  # from a build tree, a non-default data directory comes from the SDK's own
  # package file, and so does a non-default package-file location, which the
  # install writes under the configured cmake directory, and a .cxx unit in a
  # manifest reaches the object list. Every
  # object-path assertion reads actual SCons outputs; nothing here reimplements
  # the SConstruct mapping.
  # --------------------------------------------------------------------------
  relocated-consumer:
    name: relocated SDK consumer (clean checkout)
    runs-on: ubuntu-24.04
    needs: [install-check, openusd]
    timeout-minutes: 120
    steps:
      - name: Checkout usdRig under a different directory name
        uses: actions/checkout@v4
        with:
          path: consumer-src

      - name: Install consumer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ ninja-build libgl1-mesa-dev xorg-dev
          python3 -m pip install --break-system-packages scons

      - name: Download installed SDK data only
        uses: actions/download-artifact@v4
        with:
          name: usdrig-sdk-data.tar

      # The same install with RIGEXEC_INSTALL_CMAKEDIR and RIGEXEC_INSTALL_DATADIR
      # spelled differently: the package file is not under lib/cmake/rigExec here.
      - name: Download the non-default-layout SDK data
        uses: actions/download-artifact@v4
        with:
          name: usdrig-sdk-alt.tar

      # Third-party dependency for the in-place configure leg below, the same
      # prefix every other job uses -- not a usdRig build artifact.
      - name: Download OpenUSD prefix (in-place configure only)
        uses: actions/download-artifact@v4
        with:
          name: usd-install.tar

      - name: Extract SDK data and OpenUSD prefix
        run: |
          mkdir -p sdk-relocated sdk-alt usd-install
          tar -C sdk-relocated -xf usdrig-sdk-data.tar
          tar -C sdk-alt -xf usdrig-sdk-alt.tar
          tar -C usd-install -xf usd-install.tar
          test -f sdk-alt/cmake/rigExec-alt/rigExecConfig.cmake \
            || { echo "the alt layout has no package file where it was installed"; exit 1; }
          test ! -e sdk-alt/lib/cmake/rigExec \
            || { echo "the alt layout still carries the default package directory"; exit 1; }

      - name: Assert a clean room with no producer path
        run: |
          test "$(git -C consumer-src rev-parse HEAD)" = "$GITHUB_SHA" \
            || { echo "consumer checkout is not $GITHUB_SHA"; exit 1; }
          test ! -e "$GITHUB_WORKSPACE/CMakeLists.txt" \
            || { echo "producer checkout present at $GITHUB_WORKSPACE"; exit 1; }
          test ! -e "$GITHUB_WORKSPACE/build" \
            || { echo "producer build tree present at $GITHUB_WORKSPACE/build"; exit 1; }
          test ! -e "$GITHUB_WORKSPACE/usdrig-install" \
            || { echo "producer prefix present at $GITHUB_WORKSPACE/usdrig-install"; exit 1; }
          test ! -e "$GITHUB_WORKSPACE/usdrig-build.tar" \
            || { echo "build artifact downloaded into the clean room"; exit 1; }
          test ! -e consumer-src/build \
            || { echo "relocated checkout carries a build tree"; exit 1; }
          for f in \
            sdk-relocated/share/rigExec/runtimeSources.txt \
            sdk-relocated/share/rigExec/evalCoreSources.txt \
            sdk-relocated/share/rigExec/runtimeIncludes.txt \
            sdk-relocated/share/rigExec/evalCoreIncludes.txt \
            sdk-relocated/share/rigExec/opCoreSources.txt \
            sdk-relocated/share/rigExec/exactFpFlags.txt \
            sdk-relocated/lib/cmake/rigExec/rigexec_flags.cmake \
            sdk-relocated/lib/cmake/rigExec/rigExecConfig.cmake
          do
            test -f "$f" || { echo "SDK transfer is missing $f"; exit 1; }
          done

      # The SConstruct resolves the SDK's data directory out of the installed
      # package file, the same spelling CMake's packaging writes. Read it the
      # way the consumer does and require all six files there.
      - name: Resolve the data directory the installed SDK declares
        run: |
          python3 - "$GITHUB_WORKSPACE/sdk-relocated" <<'PY'
          import os, re, sys
          prefix = sys.argv[1]
          config = os.path.join(prefix, "lib", "cmake", "rigExec",
                                "rigExecConfig.cmake")
          declared = re.search(r'rigExec_DATA_DIR\s+"([^"]+)"', open(config).read())
          if not declared:
              sys.exit("the installed package file names no rigExec_DATA_DIR")
          resolved = declared.group(1).replace("${PACKAGE_PREFIX_DIR}", prefix)
          print("rigExec_DATA_DIR -> " + resolved)
          missing = [name for name in ("runtimeSources.txt", "evalCoreSources.txt",
                                       "runtimeIncludes.txt", "evalCoreIncludes.txt",
                                       "opCoreSources.txt", "exactFpFlags.txt")
                     if not os.path.isfile(os.path.join(resolved, name))]
          if missing:
              sys.exit("the declared data directory holds no " + ", ".join(missing))
          PY

      - name: Compile relocated manifests with no pxr include path
        run: |
          ./consumer-src/bin/check_runtime_usd_free.sh \
            --sdk "$GITHUB_WORKSPACE/sdk-relocated/share/rigExec" --list-objects \
            | tee "$GITHUB_WORKSPACE/sdk-objects.txt"

      # The exporter keeps every compiled translation-unit final suffix (CMake,
      # this check and the SConstruct share one case-sensitive list), so an
      # installed manifest may name .cxx units: a multi-dot mesh.scalar.cxx and
      # a mesh.cpp / mesh.cxx pair in one directory. Each must resolve under the
      # manifest directory, compile, and add exactly one distinct object.
      - name: Compile an installed manifest that names multi-dot and same-stem .cxx units
        run: |
          cp -r sdk-relocated/share/rigExec cxx-sdk
          probe='#include "rigExecGraph/opGraph.h"\nstatic int RigExecManifestCxxProbe(){ return 0; }\n'
          mkdir -p consumer-src/runtime-probe
          for unit in manifest_probe.cxx mesh.cpp mesh.cxx mesh.scalar.cxx; do
            printf "$probe" > "cxx-sdk/runtime-generated/$unit"
            sed -i "1i runtime-generated/$unit" cxx-sdk/runtimeSources.txt
          done
          for unit in mesh.cpp mesh.cxx mesh.scalar.cxx; do
            printf "$probe" > "consumer-src/runtime-probe/$unit"
            sed -i "1i runtime-probe/$unit" cxx-sdk/runtimeSources.txt
          done
          ./consumer-src/bin/check_runtime_usd_free.sh --sdk "$GITHUB_WORKSPACE/cxx-sdk" \
            --list-objects | tee "$GITHUB_WORKSPACE/sdk-cxx-objects.txt"
          python3 - "$GITHUB_WORKSPACE/sdk-objects.txt" \
            "$GITHUB_WORKSPACE/sdk-cxx-objects.txt" <<'PY'
          import sys

          base_path, cxx_path = sys.argv[1:3]


          def targets(path):
              with open(path, encoding="utf-8") as handle:
                  return [line.split(": ", 1)[1].strip()
                          for line in handle if line.startswith("object: ")]


          base, with_cxx = targets(base_path), targets(cxx_path)
          expected = [
              "runtime-generated@mesh.cpp.o", "runtime-generated@mesh.cxx.o",
              "runtime-generated@mesh.scalar.cxx.o",
              "runtime-generated@manifest_probe.cxx.o",
              "runtime-probe@mesh.cpp.o", "runtime-probe@mesh.cxx.o",
              "runtime-probe@mesh.scalar.cxx.o",
          ]
          failures = []
          for name in expected:
              hits = [obj for obj in with_cxx if obj == name]
              print(("ok:   " if len(hits) == 1 else "FAIL:  ") + name)
              if len(hits) != 1:
                  failures.append(name)
          if len(with_cxx) != len(set(with_cxx)):
              failures.append("two manifest sources share one object target")
          if len(with_cxx) != len(base) + len(expected):
              failures.append("expected %d more objects than the %d the SDK set "
                              "builds, got %d" % (len(expected), len(base),
                                                  len(with_cxx) - len(base)))
          for failure in failures:
              print("FAIL:  " + failure)
          if failures:
              sys.exit(1)
          print("\nthe multi-dot and same-stem units added %d distinct object "
                "targets (%d total)" % (len(expected), len(with_cxx)))
          PY

      # The installed include manifests name the SDK's and the consumer's
      # include directories, and a C unit reads them just as a C++ unit does:
      # a .c source listed in the source manifests, on the SDK payload side and
      # on the consumer-checkout side, must reach a header that exists only in
      # an include-manifest directory and get its own object target.
      - name: Compile manifest-listed .c units through installed include directories
        run: |
          cp -r sdk-relocated/share/rigExec c-sdk
          mkdir -p c-sdk/runtime-generated/probe-include \
            consumer-src/runtime-probe-c/headers
          printf '%s\n' '#ifndef RIGEXEC_MANIFEST_C_PROBE_H' \
            '#define RIGEXEC_MANIFEST_C_PROBE_H 4271' '#endif' \
            > c-sdk/runtime-generated/probe-include/rigExecManifestCProbe.h
          printf '%s\n' '#ifndef RIGEXEC_MANIFEST_C_PROBE_CHECKOUT_H' \
            '#define RIGEXEC_MANIFEST_C_PROBE_CHECKOUT_H 6199' '#endif' \
            > consumer-src/runtime-probe-c/headers/rigExecManifestCProbeCheckout.h
          printf '%s\n' '#include "rigExecManifestCProbe.h"' \
            'int RigExecManifestCProbeSdk(void){ return RIGEXEC_MANIFEST_C_PROBE_H; }' \
            > c-sdk/runtime-generated/probe_c_sdk.c
          printf '%s\n' '#include "rigExecManifestCProbeCheckout.h"' \
            'int RigExecManifestCProbeCheckout(void){ return RIGEXEC_MANIFEST_C_PROBE_CHECKOUT_H; }' \
            > consumer-src/runtime-probe-c/probe_c_checkout.c
          for entry in runtime-generated/probe_c_sdk.c runtime-probe-c/probe_c_checkout.c; do
            sed -i "1i $entry" c-sdk/runtimeSources.txt
          done
          for entry in runtime-generated/probe-include runtime-probe-c/headers; do
            sed -i "1i $entry" c-sdk/runtimeIncludes.txt
          done
          ./consumer-src/bin/check_runtime_usd_free.sh --sdk "$GITHUB_WORKSPACE/c-sdk" \
            --list-objects | tee sdk-c-objects.txt
          for object in 'runtime-generated@probe_c_sdk.c.o' \
                        'runtime-probe-c@probe_c_checkout.c.o'; do
            grep -F "object: $object" sdk-c-objects.txt >/dev/null \
              || { echo "no object target for the installed .c unit $object"; exit 1; }
          done
          sed -i '\|^runtime-generated/probe-include$|d; \|^runtime-probe-c/headers$|d' \
            c-sdk/runtimeIncludes.txt
          if ./consumer-src/bin/check_runtime_usd_free.sh --sdk "$GITHUB_WORKSPACE/c-sdk" \
              > sdk-c-noinclude.log 2>&1; then
            echo "an installed .c unit compiled without the installed include directories"
            exit 1
          fi
          grep -F "rigExecManifestCProbe" sdk-c-noinclude.log >/dev/null \
            || { echo "the failure did not name the header only the include manifest supplies"
                 cat sdk-c-noinclude.log; exit 1; }
          echo "installed mode: .c units on both sides read the include manifests"

      # The strict installed-manifest rule stays strict: one producer-absolute
      # entry in an otherwise valid copied SDK manifest must fail, and the
      # diagnostic must name that entry.
      - name: Reject a producer-absolute entry in a copied SDK manifest
        run: |
          cp -r sdk-relocated/share/rigExec bad-sdk
          entry=/producer-build/libs/rigExecRuntime/open.cpp
          sed -i "1i $entry" bad-sdk/runtimeSources.txt
          if ./consumer-src/bin/check_runtime_usd_free.sh --sdk bad-sdk 2>bad-sdk.log; then
            echo "a producer-absolute installed entry compiled"; exit 1
          fi
          grep -F "runtimeSources.txt: $entry:" bad-sdk.log \
            || { echo "the failure did not name the offending entry"; cat bad-sdk.log; exit 1; }

      # A non-compiled suffix must not hide a producer path: the Windows
      # cmake_pch.cxx that broke the exporter would slip past a suffix filter
      # applied before path validation. Independent copy, same strict rule.
      - name: Reject a producer-absolute cmake_pch.cxx entry in a copied SDK manifest
        run: |
          cp -r sdk-relocated/share/rigExec bad-sdk-pch
          entry=/producer/build/cmake_pch.cxx
          sed -i "1i $entry" bad-sdk-pch/runtimeSources.txt
          if ./consumer-src/bin/check_runtime_usd_free.sh --sdk bad-sdk-pch 2>bad-sdk-pch.log; then
            echo "a producer-absolute .cxx entry compiled"; exit 1
          fi
          grep -F "runtimeSources.txt: $entry:" bad-sdk-pch.log \
            || { echo "the failure did not name the offending entry"; cat bad-sdk-pch.log; exit 1; }
          grep -F "installed entries are relative" bad-sdk-pch.log >/dev/null \
            || { echo "the failure did not state the relative-path rule"; exit 1; }

      - name: Unpack the tutorial archive and fetch pinned godot-cpp
        run: |
          python3 -m zipfile -e consumer-src/docs/examples/godot_rolling_ball.zip tutorial-sdk
          python3 -m zipfile -e consumer-src/docs/examples/godot_rolling_ball.zip tutorial-inplace
          pin="$(grep -o 'godot-cpp checkout [0-9a-f]\{40\}' \
            consumer-src/docs/concepts/tutorial-godot-baked-rig.md | head -n 1 | awk '{print $3}')"
          test -n "$pin" || { echo "the tutorial names no pinned godot-cpp revision"; exit 1; }
          echo "godot-cpp pin from the tutorial: $pin"
          git clone https://github.com/godotengine/godot-cpp.git \
            tutorial-sdk/godot_rigExec/thirdparty/godot-cpp
          git -C tutorial-sdk/godot_rigExec/thirdparty/godot-cpp checkout "$pin"
          git -C tutorial-sdk/godot_rigExec/thirdparty/godot-cpp submodule update --init --recursive
          mkdir -p tutorial-inplace/godot_rigExec/thirdparty
          cp -r tutorial-sdk/godot_rigExec/thirdparty/godot-cpp \
            tutorial-inplace/godot_rigExec/thirdparty/godot-cpp

      # api_version=4.7 is what the tutorial's own demo/setup_rolling.py --build
      # passes; the pinned godot-cpp refuses to configure without it.
      - name: Build template_debug against the relocated SDK
        run: |
          cd tutorial-sdk/godot_rigExec
          scons -j"$(nproc)" platform=linux target=template_debug api_version=4.7 \
            "sdk_root=$GITHUB_WORKSPACE/sdk-relocated" \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            2>&1 | tee "$GITHUB_WORKSPACE/scons-debug.log"
          test "${PIPESTATUS[0]}" -eq 0
          find build/obj -type f | sort | xargs sha256sum > "$GITHUB_WORKSPACE/debug-object-hashes.txt"

      - name: Build template_release in the same tree without cleaning
        run: |
          cd tutorial-sdk/godot_rigExec
          scons -j"$(nproc)" platform=linux target=template_release api_version=4.7 \
            "sdk_root=$GITHUB_WORKSPACE/sdk-relocated" \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            2>&1 | tee "$GITHUB_WORKSPACE/scons-release.log"
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify both configurations share no object target
        run: |
          python3 - "$GITHUB_WORKSPACE/tutorial-sdk/godot_rigExec" \
            "$GITHUB_WORKSPACE/sdk-relocated/share/rigExec" \
            "$GITHUB_WORKSPACE/consumer-src" \
            "$GITHUB_WORKSPACE/debug-object-hashes.txt" <<'PY'
          import hashlib, os, sys

          tutorial, manifest_dir, checkout, hashes_path = sys.argv[1:5]
          failures = []


          def check(cond, msg):
              print(("ok:   " if cond else "FAIL:  ") + msg)
              if not cond:
                  failures.append(msg)


          def no_ext(path):
              return os.path.splitext(path)[0]


          # Both link products, found by the target= names this job passed to SCons.
          bindir = os.path.join(tutorial, "addons", "rigexec", "bin")
          libs = sorted(os.listdir(bindir))
          debug_libs = [n for n in libs if "template_debug" in n and n.endswith(".so")]
          release_libs = [n for n in libs if "template_release" in n and n.endswith(".so")]
          check(bool(debug_libs), "template_debug link product present (%s)" % debug_libs)
          check(bool(release_libs), "template_release link product present (%s)" % release_libs)


          def suffix_of(name):
              stem = name[len("librigexec"):] if name.startswith("librigexec") else name
              return stem[: -len(".so")].lstrip(".")


          obj = os.path.join(tutorial, "build", "obj")
          debug_root = os.path.join(obj, suffix_of(debug_libs[0])) if debug_libs else None
          release_root = os.path.join(obj, suffix_of(release_libs[0])) if release_libs else None
          check(debug_root is not None and os.path.isdir(debug_root),
                "debug object root exists (%s)" % debug_root)
          check(release_root is not None and os.path.isdir(release_root),
                "release object root exists (%s)" % release_root)
          check(debug_root != release_root,
                "distinct configuration roots (%s vs %s)" % (debug_root, release_root))


          def actuals(root):
              found = set()
              for dirpath, _, filenames in os.walk(root):
                  for name in filenames:
                      found.add(os.path.relpath(os.path.join(dirpath, name), root).replace(os.sep, "/"))
              return found


          debug = actuals(debug_root) if debug_root and os.path.isdir(debug_root) else set()
          release = actuals(release_root) if release_root and os.path.isdir(release_root) else set()
          check(bool(debug) and bool(release),
                "both configurations produced objects (%d debug, %d release)"
                % (len(debug), len(release)))

          # Disjointness compares full tree-relative targets: the per-config
          # keys repeat by design, the configuration roots must not.
          debug_full = {"build/obj/" + suffix_of(debug_libs[0]) + "/" + p for p in debug} \
              if debug_libs else set()
          release_full = {"build/obj/" + suffix_of(release_libs[0]) + "/" + p for p in release} \
              if release_libs else set()
          shared = sorted(debug_full & release_full)
          check(not shared, "no shared normalized object target (%d shared%s)"
                % (len(shared), (": " + ", ".join(shared[:5])) if shared else ""))
          shared_stems = sorted({no_ext(p) for p in debug_full} & {no_ext(p) for p in release_full})
          check(not shared_stems, "no shared object stem across configurations (%d shared)"
                % len(shared_stems))

          # The debug tree recorded between the builds must still be there, byte-identical.
          persisted = True
          recorded = 0
          with open(hashes_path, encoding="utf-8") as handle:
              for line in handle:
                  line = line.strip()
                  if not line:
                      continue
                  recorded += 1
                  digest, _, rel = line.partition(" ")
                  rel = rel.strip()
                  full = os.path.join(tutorial, rel)
                  if not os.path.isfile(full):
                      print("missing after the release build: " + rel)
                      persisted = False
                      continue
                  with open(full, "rb") as blob:
                      if hashlib.sha256(blob.read()).hexdigest() != digest.strip():
                          print("changed by the release build: " + rel)
                          persisted = False
          check(recorded > 0, "debug hash list recorded %d objects" % recorded)
          check(persisted, "debug objects still present and unchanged after the release build")

          def object_key(path, config_suffix):
              # godot-cpp names every object <key><config suffix>.o (.obj on MSVC);
              # with no template target its config suffix is the ".os" fallback.
              for tagged in [c + ext for c in ("." + config_suffix, ".os")
                            for ext in (".o", ".obj")]:
                  if path.endswith(tagged):
                      return path[: -len(tagged)]
              return no_ext(path)


          # Named evidence: both generated TUs, under the generated/ key, in both builds.
          # Expected keys follow the object-key contract stated in
          # docs/godot_example/SConstruct and are asserted here against the
          # actual files SCons produced.
          for needle in ("ClothMoverKernel", "moverCatalog"):
              in_debug = sorted(p for p in debug if needle in p)
              in_release = sorted(p for p in release if needle in p)
              check(bool(in_debug) and bool(in_release),
                    "%s objects in both configs (debug: %s; release: %s)"
                    % (needle, in_debug, in_release))
              check(all(p.startswith("generated/") for p in in_debug + in_release),
                    "%s objects key under generated/" % needle)

          # Every manifest TU resolves to an actual object in both configurations.
          sources = []
          for name in ("runtimeSources.txt", "evalCoreSources.txt",
                       "opCoreSources.txt"):
              with open(os.path.join(manifest_dir, name), encoding="utf-8") as handle:
                  sources.extend(line.strip() for line in handle if line.strip())
          sources = [e for e in sources
                     if e.endswith((".c", ".cc", ".cxx", ".cpp", ".c++"))]
          config_suffix = {"debug": suffix_of(debug_libs[0]) if debug_libs else "",
                           "release": suffix_of(release_libs[0]) if release_libs else ""}
          missing = []
          for entry in sources:
              first, _, rest = entry.partition("/")
              if first == "runtime-generated":
                  key = "generated/" + rest
              else:
                  key = "checkout/" + entry
              for label, actual in (("debug", debug), ("release", release)):
                  if not any(object_key(p, config_suffix[label]) == key for p in actual):
                      missing.append("%s: %s (%s)" % (label, entry, key))
          check(bool(sources), "%d manifest TUs to cover" % len(sources))
          check(not missing, "every manifest TU has an object in both configs%s"
                % (": " + ", ".join(missing[:6]) if missing else ""))

          # Object-key hygiene on every actual target: no drive, absolute segment or '..'.
          bad = [p for p in debug | release
                 if p.startswith("/") or ".." in p.split("/") or p.split("/")[0].endswith(":")]
          check(not bad, "object keys carry no drive, absolute segment or '..'%s"
                % (": " + ", ".join(bad[:5]) if bad else ""))

          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nrelocated SDK leg verified: %d debug + %d release objects"
                % (len(debug), len(release)))
          PY

      - name: Configure the relocated checkout for the in-place leg
        run: |
          cmake -S consumer-src -B consumer-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="${GITHUB_WORKSPACE}/usd-install" \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/usd-install" \
            -DRIGEXEC_BUILD_PYTHON=OFF \
            -DRIGEXEC_BUILD_USDNOODLES=OFF \
            -DRIGEXEC_BUILD_TESTS=OFF
          cmake --build consumer-src/build --target rigExecRuntime --parallel "$(nproc)"

      # Automatic in-place discovery: no sdk_root is passed, so the default
      # probe location holds no manifest set and the configured build tree wins.
      # --tree=all asks SCons itself for the target DAG it computed, with
      # --dry-run so nothing is compiled; the listing below is checked for
      # the targets SCons named.
      - name: Enumerate in-place SCons targets for both configurations
        run: |
          test ! -e tutorial-inplace/usd-install \
            || { echo "the default SDK location holds an SDK; in-place discovery is not being tested"; exit 1; }
          cd tutorial-inplace/godot_rigExec
          scons -Q --tree=all --dry-run platform=linux target=template_debug api_version=4.7 \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            > "$GITHUB_WORKSPACE/inplace-debug-targets.txt" 2>&1
          scons -Q --tree=all --dry-run platform=linux target=template_release api_version=4.7 \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            > "$GITHUB_WORKSPACE/inplace-release-targets.txt" 2>&1
          grep -F "(build mode)" "$GITHUB_WORKSPACE/inplace-debug-targets.txt" >/dev/null \
            || { echo "in-place discovery did not take the build tree"
                 head -n 20 "$GITHUB_WORKSPACE/inplace-debug-targets.txt"; exit 1; }

      - name: Verify the in-place enumeration shares no target
        run: |
          python3 - "$GITHUB_WORKSPACE/inplace-debug-targets.txt" \
            "$GITHUB_WORKSPACE/inplace-release-targets.txt" <<'PY'
          import re, sys

          debug_listing, release_listing = sys.argv[1:3]
          failures = []


          def check(cond, msg):
              print(("ok:   " if cond else "FAIL:  ") + msg)
              if not cond:
                  failures.append(msg)


          def enumerated(path):
              found = set()
              with open(path, encoding="utf-8") as handle:
                  for line in handle:
                      for token in re.findall(r"(?:\./)?build/obj/\S+", line):
                          found.add(token.lstrip("./").rstrip("',\";)"))
              return found


          debug = enumerated(debug_listing)
          release = enumerated(release_listing)
          check(bool(debug) and bool(release),
                "both configurations enumerate object targets (%d debug, %d release)"
                % (len(debug), len(release)))

          shared = sorted(debug & release)
          check(not shared, "no shared enumerated target (%d shared%s)"
                % (len(shared), (": " + ", ".join(shared[:5])) if shared else ""))

          debug_roots = {p.split("/")[2] for p in debug if len(p.split("/")) > 2}
          release_roots = {p.split("/")[2] for p in release if len(p.split("/")) > 2}
          check(len(debug_roots) == 1 and len(release_roots) == 1 and debug_roots != release_roots,
                "distinct configuration roots (%s vs %s)"
                % (sorted(debug_roots), sorted(release_roots)))

          for needle in ("ClothMoverKernel", "moverCatalog"):
              in_debug = sorted(p for p in debug if needle in p)
              in_release = sorted(p for p in release if needle in p)
              check(bool(in_debug) and bool(in_release),
                    "%s enumerated in both configs (debug: %s; release: %s)"
                    % (needle, in_debug, in_release))

          bad = [p for p in debug | release
                 if p.startswith("/") or ".." in p.split("/") or p.split("/")[0].endswith(":")]
          check(not bad, "enumerated keys carry no drive, absolute segment or '..'")

          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nin-place enumeration verified: %d debug + %d release targets"
                % (len(debug), len(release)))
          PY

      # One directory supplies the whole set. Here the checkout is configured,
      # so a usdRig build tree holds a complete manifest set: an SDK prefix or
      # manifest_dir missing one of the five files must be refused by name,
      # never completed from the build tree, which would pair one root's
      # sources with the other's flags and produce a library that drifts.
      - name: Reject a manifest set missing one file
        run: |
          cp -r sdk-relocated sdk-partial
          rm "sdk-partial/share/rigExec/exactFpFlags.txt"
          cd tutorial-sdk/godot_rigExec
          for source in "sdk_root=$GITHUB_WORKSPACE/sdk-partial" \
                        "manifest_dir=$GITHUB_WORKSPACE/sdk-partial/share/rigExec"; do
            if scons -Q --tree=all --dry-run platform=linux target=template_debug \
                api_version=4.7 "$source" \
                "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
                > "$GITHUB_WORKSPACE/partial-sdk.log" 2>&1
            then
              echo "an incomplete manifest set built ($source)"; exit 1
            fi
            grep -F "missing exactFpFlags.txt" "$GITHUB_WORKSPACE/partial-sdk.log" >/dev/null \
              || { echo "the failure did not name the missing manifest ($source)"
                   cat "$GITHUB_WORKSPACE/partial-sdk.log"; exit 1; }
            if grep -F "build/obj" "$GITHUB_WORKSPACE/partial-sdk.log" >/dev/null; then
              echo "the incomplete set still enumerated build-tree objects ($source)"
              exit 1
            fi
          done

      # An SDK installed to a non-default data layout names that layout in its
      # own package file. sdk_root must follow it, and must stay in installed-
      # SDK mode here even though consumer-src/build now holds a complete
      # in-place manifest set -- the fallback the tutorial used to take.
      - name: Follow the data directory the installed SDK declares
        run: |
          cp -r sdk-relocated sdk-weird
          mv sdk-weird/share/rigExec "sdk-weird/share/rigExec data"
          sed -i 's|rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/rigExec")|rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/rigExec data")|' \
            sdk-weird/lib/cmake/rigExec/rigExecConfig.cmake
          grep -F 'rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/rigExec data")' \
            sdk-weird/lib/cmake/rigExec/rigExecConfig.cmake >/dev/null \
            || { echo "the SDK package file was not rewritten"; exit 1; }
          cd tutorial-inplace/godot_rigExec
          scons -Q --tree=all --dry-run platform=linux target=template_debug \
            api_version=4.7 "sdk_root=$GITHUB_WORKSPACE/sdk-weird" \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            > "$GITHUB_WORKSPACE/weird-layout-targets.txt" 2>&1
          grep -F "manifests: $GITHUB_WORKSPACE/sdk-weird/share/rigExec data (sdk mode)" \
            "$GITHUB_WORKSPACE/weird-layout-targets.txt" >/dev/null \
            || { echo "SCons did not take the data directory the SDK declares"
                 cat "$GITHUB_WORKSPACE/weird-layout-targets.txt"; exit 1; }
          grep -F "generated/moverCatalog" "$GITHUB_WORKSPACE/weird-layout-targets.txt" >/dev/null \
            || { echo "the non-default set enumerated no generated object"
                 exit 1; }

      # The package file itself moves with RIGEXEC_INSTALL_CMAKEDIR, so this
      # SDK prefix has no lib/cmake/rigExec at all: the default location finds
      # nothing, and the SConstruct must locate the package file where the
      # install put it instead of falling back to the configured build tree
      # beside it.
      - name: Follow the package file a configured cmake directory installs
        run: |
          cd tutorial-inplace/godot_rigExec
          scons -Q --tree=all --dry-run platform=linux target=template_debug \
            api_version=4.7 "sdk_root=$GITHUB_WORKSPACE/sdk-alt" \
            "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            > "$GITHUB_WORKSPACE/alt-layout-targets.txt" 2>&1
          grep -F "manifests: $GITHUB_WORKSPACE/sdk-alt/sdk data (sdk mode)" \
            "$GITHUB_WORKSPACE/alt-layout-targets.txt" >/dev/null \
            || { echo "SCons did not find the package file where the SDK installed it"
                 cat "$GITHUB_WORKSPACE/alt-layout-targets.txt"; exit 1; }
          grep -F "generated/moverCatalog" "$GITHUB_WORKSPACE/alt-layout-targets.txt" >/dev/null \
            || { echo "the alt-layout set enumerated no generated object"
                 exit 1; }

      # One case-sensitive final-suffix policy covers the exporter, this
      # consumer and the shell check. A multi-dot unit (mesh.scalar.cxx) and a
      # mesh.cpp / mesh.cxx pair in ONE directory must each reach the target
      # list, keyed under its own grammar root with its full source filename,
      # so no two units ever share an object target. No sdk_root is passed: the
      # configured build tree supplies the manifests here.
      - name: Enumerate a build-tree manifest that names multi-dot and same-stem units
        run: |
          probe='#include "rigExecGraph/opGraph.h"\nstatic int RigExecManifestProbe(){ return 0; }\n'
          mkdir -p consumer-src/runtime-probe
          for unit in manifest_probe.cxx mesh.cpp mesh.cxx mesh.scalar.cxx; do
            printf "$probe" > "consumer-src/build/runtime-generated/$unit"
            sed -i "1i runtime-generated/$unit" consumer-src/build/runtimeSources.txt
          done
          for unit in mesh.cpp mesh.cxx mesh.scalar.cxx; do
            printf "$probe" > "consumer-src/runtime-probe/$unit"
            sed -i "1i runtime-probe/$unit" consumer-src/build/runtimeSources.txt
          done
          cd tutorial-inplace/godot_rigExec
          scons -Q --tree=all --dry-run platform=linux target=template_release \
            api_version=4.7 "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
            > "$GITHUB_WORKSPACE/cxx-probe-targets.txt" 2>&1
          python3 - "$GITHUB_WORKSPACE/cxx-probe-targets.txt" <<'PY'
          import re, sys

          keys = [
              "generated/manifest_probe.cxx", "generated/mesh.cpp", "generated/mesh.cxx",
              "generated/mesh.scalar.cxx", "checkout/runtime-probe/mesh.cpp",
              "checkout/runtime-probe/mesh.cxx", "checkout/runtime-probe/mesh.scalar.cxx",
          ]
          with open(sys.argv[1], encoding="utf-8") as handle:
              listing = handle.read()
          targets = {token.lstrip("./").rstrip("',\";)")
                     for token in re.findall(r"(?:\./)?build/obj/\S+", listing)}
          failures = []
          for key in keys:
              hits = sorted(t for t in targets if key in t and t.endswith((".o", ".os")))
              print(("ok:   " if len(hits) == 1 else "FAIL:  ") + key + " -> " + str(hits))
              if len(hits) != 1:
                  failures.append(key)
          mesh_all = sorted(t for t in targets if "mesh" in t)
          print("mesh object targets: " + ", ".join(mesh_all))
          if len(set(mesh_all)) != 6:
              failures.append("six distinct mesh object targets, got %d" % len(set(mesh_all)))
          if failures:
              print("\n%d failure(s)" % len(failures))
              sys.exit(1)
          print("\nmulti-dot and same-stem units reached %d distinct object targets" % len(set(mesh_all)))
          PY

      # An explicitly selected SDK is authoritative. Its package descriptor may
      # name a data directory that is not there; with a fully configured build
      # tree beside it, the build must still stop rather than swap roots.
      - name: Reject an explicit SDK whose descriptor names an absent data directory
        run: |
          cp -r sdk-relocated sdk-ghost
          sed -i 's|rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/rigExec")|rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/absent-layout")|' \
            sdk-ghost/lib/cmake/rigExec/rigExecConfig.cmake
          grep -F 'rigExec_DATA_DIR "${PACKAGE_PREFIX_DIR}/share/absent-layout")' \
            sdk-ghost/lib/cmake/rigExec/rigExecConfig.cmake >/dev/null \
            || { echo "the SDK package file was not rewritten"; exit 1; }
          test -f sdk-ghost/share/rigExec/runtimeSources.txt \
            || { echo "the ghost SDK lost its real data directory"; exit 1; }
          for name in runtimeSources evalCoreSources runtimeIncludes evalCoreIncludes; do
            test -f "consumer-src/build/$name.txt" \
              || { echo "the build tree holds no $name.txt"; exit 1; }
          done
          cd tutorial-inplace/godot_rigExec
          if scons -Q --tree=all --dry-run platform=linux target=template_debug \
              api_version=4.7 "sdk_root=$GITHUB_WORKSPACE/sdk-ghost" \
              "usdrig_root=$GITHUB_WORKSPACE/consumer-src" \
              > "$GITHUB_WORKSPACE/ghost-sdk.log" 2>&1
          then
            echo "an SDK whose descriptor names an absent data directory built from the build tree"
            exit 1
          fi
          grep -F "share/absent-layout" "$GITHUB_WORKSPACE/ghost-sdk.log" >/dev/null \
            || { echo "the failure did not name the data directory the descriptor declares"
                 cat "$GITHUB_WORKSPACE/ghost-sdk.log"; exit 1; }
          if grep -F "build/obj" "$GITHUB_WORKSPACE/ghost-sdk.log" >/dev/null; then
            echo "the rejected SDK still enumerated build-tree objects"
            exit 1
          fi
          echo "explicit SDK with an absent data directory refused the build tree"

      - name: Upload consumer logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relocated-consumer-logs
          path: |
            scons-debug.log
            scons-release.log
            debug-object-hashes.txt
            inplace-debug-targets.txt
            inplace-release-targets.txt
            partial-sdk.log
            weird-layout-targets.txt
            cxx-probe-targets.txt
            sdk-objects.txt
            sdk-cxx-objects.txt


  platform-cpp:
    name: Release C++ (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            jobs: 4
          - os: macos-15
            jobs: 2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Checkout OpenUSD
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          path: OpenUSD

      - name: Set up Python for build tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install "cmake>=3.26,<4" ninja

      - name: OpenUSD commit
        id: usd
        shell: bash
        run: echo "sha=$(git -C OpenUSD rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Windows toolchain identity
        if: runner.os == 'Windows'
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $version = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: macOS toolchain identity
        if: runner.os == 'macOS'
        id: xcode
        shell: bash
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache OpenUSD
        id: usd-cache
        uses: actions/cache@v4
        with:
          path: usd-install
          key: openusd-${{ matrix.os }}-${{ runner.arch }}-${{ steps.usd.outputs.sha }}-${{ steps.msvc.outputs.version }}${{ steps.xcode.outputs.version }}-exec-imaging-nopy-v1

      - name: Build OpenUSD on Windows
        if: runner.os == 'Windows' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          python OpenUSD\build_scripts\build_usd.py usd-install --build usd-build --generator Ninja --build-variant release --jobs ${{ matrix.jobs }} --usd-imaging --no-usdview --no-python --no-tests --no-examples --no-tutorials --no-docs --no-materialx --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Build OpenUSD on macOS
        if: runner.os == 'macOS' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python OpenUSD/build_scripts/build_usd.py usd-install \
            --build usd-build --generator Ninja --build-variant release \
            --jobs ${{ matrix.jobs }} --usd-imaging --no-usdview --no-python \
            --no-tests --no-examples --no-tutorials --no-docs --no-materialx \
            --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          set "USD=%GITHUB_WORKSPACE%\usd-install"
          call bin\_env.bat
          set "PXR_PLUGINPATH_NAME=%GITHUB_WORKSPACE%\build\usd\rigExecSchema\resources;%GITHUB_WORKSPACE%\build\usd\rigExecImaging\resources;%GITHUB_WORKSPACE%\build\usd\rigExecMoverPlugins"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSD_INSTALL_DIR="%USD%" -DCMAKE_PREFIX_PATH="%USD%" -DRIGEXEC_BUILD_PYTHON=OFF -DRIGEXEC_BUILD_USDNOODLES=OFF
          if errorlevel 1 exit /b 1
          cmake --build build --parallel ${{ matrix.jobs }} -- -k 0
          if errorlevel 1 exit /b 1
          ctest --test-dir build --parallel ${{ matrix.jobs }} --output-on-failure --no-tests=error
          if errorlevel 1 exit /b 1
          cmake --install build --prefix "%GITHUB_WORKSPACE%/usdrig-install"
          if errorlevel 1 exit /b 1
          cmake -S tests/installedScene -B installed-scene-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="%GITHUB_WORKSPACE%/usdrig-install;%USD%"
          if errorlevel 1 exit /b 1
          cmake --build installed-scene-build --parallel 2
          if errorlevel 1 exit /b 1
          ctest --test-dir installed-scene-build --output-on-failure

      - name: Build and test on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export USD="$GITHUB_WORKSPACE/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="$USD" -DCMAKE_PREFIX_PATH="$USD" \
            -DRIGEXEC_BUILD_PYTHON=OFF -DRIGEXEC_BUILD_USDNOODLES=OFF
          cmake --build build --parallel ${{ matrix.jobs }}
          ctest --test-dir build \
            --parallel ${{ matrix.jobs }} --output-on-failure --no-tests=error
          cmake --install build --prefix "$GITHUB_WORKSPACE/usdrig-install"
          cmake -S tests/installedScene -B installed-scene-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/usdrig-install;$USD"
          cmake --build installed-scene-build --parallel 2
          ctest --test-dir installed-scene-build --output-on-failure

      - name: Record exec-row goldens
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        shell: bash
        run: |
          export USD="$GITHUB_WORKSPACE/usd-install"
          source bin/_env.sh
          export PXR_PLUGINPATH_NAME="$PWD/build/usd/rigExecSchema/resources:$PWD/build/usd/rigExecImaging/resources:$PWD/build/usd/rigExecMoverPlugins"
          touch build/execRows.stamp
          RIGEXEC_RECORD_EXEC_ROWS=1 ctest --test-dir build \
            -R '^testRigExecExecGoldens_' \
            --parallel ${{ matrix.jobs }} --output-on-failure
          mkdir -p build/execRows
          find tests/fixtures/execRows -name '*.golden' \
            -newer build/execRows.stamp -exec cp {} build/execRows/ \;

      - name: Upload exec cross-check rows
        if: ${{ runner.os == 'macOS' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: exec-rows-macos
          path: build/execRows/

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}-${{ runner.arch }}
          path: |
            build/Testing/Temporary/
            build/verify-binary/*.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            installed-scene-build/Testing/Temporary/
            usd-build/**/log.txt
