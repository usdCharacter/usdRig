# Bundled usdview releases for v<major>.<minor>.0 tags.
#
# Each platform job builds OpenUSD 26.08 WITH usdview and Python (a cache
# lineage separate from usdrig.yml's C++-only prefix), builds usdRig with
# its Python bindings, the usdNoodles editor and the usdRigView launcher,
# assembles a relocatable bundle with packaging/assemble_bundle.py, signs
# it when signing secrets are configured, and uploads one archive. The
# publish job attaches the three archives plus SHA256SUMS.txt to a GitHub
# Release. See packaging/README.md for the layout and the secret list.
#
# Patch tags (v0.3.1) never trigger this workflow: the tag glob plus the
# gate job's strict vX.Y.0 check see to that.

name: release

on:
  push:
    tags: ["v*.*.0"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to build, e.g. v0.3.0"
        required: true
        type: string
      publish:
        description: "Create/update the GitHub Release for that tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      version-num: ${{ steps.check.outputs.version-num }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Check tag shape and CMake version agreement
        id: check
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="$GITHUB_REF_NAME"
            publish=true
          else
            version="$INPUT_VERSION"
            publish="${{ inputs.publish }}"
          fi
          if ! echo "$version" | grep -Eq '^v[0-9]+\.[0-9]+\.0$'; then
            echo "not a v<major>.<minor>.0 version: $version" >&2
            exit 1
          fi
          cmake_version="$(sed -n \
            's/^project(rigExec VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          if [ "v$cmake_version" != "$version" ]; then
            echo "CMakeLists.txt declares $cmake_version but the release" >&2
            echo "is $version; bump project(rigExec VERSION ...) first." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version-num=${version#v}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  build:
    name: bundle (${{ matrix.slug }})
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: windows-x64
            os: windows-2022
            platform: windows
            jobs: 4
          - slug: macos-arm64
            os: macos-15
            platform: macos
            jobs: 3
          - slug: linux-x64
            os: ubuntu-24.04
            platform: linux
            jobs: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - name: Checkout usdRig
        uses: actions/checkout@v4

      - name: Checkout OpenUSD @ v26.08
        uses: actions/checkout@v4
        with:
          repository: PixarAnimationStudios/OpenUSD
          ref: v26.08
          path: OpenUSD
          fetch-depth: 1

      - name: Set up Python 3.11
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PySide6/PyOpenGL must be in this interpreter before OpenUSD is
      # configured: --usdview enables usdview only when they import, and
      # this interpreter's home is what the bundle ships as app/python.
      - name: Install Python build and usdview dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.26,<4" ninja pybind11 \
            PySide6 PyOpenGL "numpy==1.26.4"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            python3-dev libglew-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxi-dev libgl1-mesa-dev xorg-dev xvfb

      - name: OpenUSD commit (cache key)
        id: usd
        shell: bash
        run: echo "sha=$(git -C OpenUSD rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Windows toolchain identity (cache key)
        if: runner.os == 'Windows'
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $version = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: macOS toolchain identity (cache key)
        if: runner.os == 'macOS'
        id: xcode
        shell: bash
        run: echo "version=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Restore cached OpenUSD (usdview + Python)
        id: usd-cache
        uses: actions/cache/restore@v4
        with:
          path: usd-install
          key: openusd-${{ matrix.os }}-${{ runner.arch }}-${{ steps.usd.outputs.sha }}-${{ steps.msvc.outputs.version }}${{ steps.xcode.outputs.version }}-exec-usdimg-usdview-py311-v1

      - name: Build OpenUSD on Windows
        if: runner.os == 'Windows' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          python OpenUSD\build_scripts\build_usd.py usd-install --build usd-build --generator Ninja --build-variant release --jobs ${{ matrix.jobs }} --usd-imaging --usdview --no-tests --no-examples --no-tutorials --no-docs --no-materialx --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Build OpenUSD on macOS / Linux
        if: runner.os != 'Windows' && steps.usd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python OpenUSD/build_scripts/build_usd.py usd-install \
            --build usd-build --generator Ninja --build-variant release \
            --jobs ${{ matrix.jobs }} --usd-imaging --usdview \
            --no-tests --no-examples --no-tutorials --no-docs \
            --no-materialx --build-args USD,"-DPXR_BUILD_EXEC=ON" -v

      - name: Drop OpenUSD build tree
        if: steps.usd-cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf usd-build

      - name: Save OpenUSD to cache
        if: steps.usd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: usd-install
          key: openusd-${{ matrix.os }}-${{ runner.arch }}-${{ steps.usd.outputs.sha }}-${{ steps.msvc.outputs.version }}${{ steps.xcode.outputs.version }}-exec-usdimg-usdview-py311-v1

      - name: Sanity - usdview and pxr are in the prefix
        shell: bash
        run: |
          test -f usd-install/bin/usdview
          test -d usd-install/lib

      - name: Build and install usdRig on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call bin\_vcvars.bat
          if errorlevel 1 exit /b 1
          set "USD=%GITHUB_WORKSPACE%\usd-install"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSD_INSTALL_DIR="%USD%" -DCMAKE_PREFIX_PATH="%USD%" -DPython3_EXECUTABLE="${{ steps.py.outputs.python-path }}" -DRIGEXEC_BUILD_PYTHON=ON -DRIGEXEC_BUILD_USDNOODLES=ON -DRIGEXEC_BUILD_TESTS=OFF -DRIGEXEC_BUILD_VIEWER_LAUNCHER=ON
          if errorlevel 1 exit /b 1
          cmake --build build --parallel ${{ matrix.jobs }}
          if errorlevel 1 exit /b 1
          cmake --install build --prefix "%GITHUB_WORKSPACE%\usdrig-install"
          if errorlevel 1 exit /b 1

      - name: Build and install usdRig on macOS / Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSD_INSTALL_DIR="$GITHUB_WORKSPACE/usd-install" \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/usd-install" \
            -DPython3_EXECUTABLE="${{ steps.py.outputs.python-path }}" \
            -DRIGEXEC_BUILD_PYTHON=ON -DRIGEXEC_BUILD_USDNOODLES=ON \
            -DRIGEXEC_BUILD_TESTS=OFF -DRIGEXEC_BUILD_VIEWER_LAUNCHER=ON
          cmake --build build --parallel ${{ matrix.jobs }}
          cmake --install build --prefix "$GITHUB_WORKSPACE/usdrig-install"

      - name: Test macOS bundle relocation and launcher checks
        if: runner.os == 'macOS'
        run: |
          python3 packaging/test_assemble_bundle.py "$PWD/build/usdRigView"
          python3 packaging/test_sign_macos.py

      # ---- Windows: assemble, smoke, sign, zip -------------------------
      - name: Assemble bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
        run: |
          $bundle = "dist/usdRig-$env:VERSION_NUM-windows-x64"
          python packaging/assemble_bundle.py `
            --usd-install usd-install --rig-install usdrig-install `
            --python-home "$env:pythonLocation" `
            --launcher build/usdRigView.exe `
            --output $bundle --version "$env:VERSION_NUM" `
            --platform windows --platform-slug windows-x64 `
            --source-root . --rig-build-dir build `
            --usdnoodles-dir build/python/UsdNoodles `
            --git-sha "${{ github.sha }}" --trim-dev
          if ($LASTEXITCODE -ne 0) { throw "assemble_bundle failed" }
          & "$bundle/usdRigView.exe" --usdRig-check
          if ($LASTEXITCODE -ne 0) { throw "bundle check failed" }

      - name: Smoke test bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
          QT_QPA_PLATFORM: offscreen
        run: |
          $bundle = "dist/usdRig-$env:VERSION_NUM-windows-x64"
          foreach ($line in (& "$bundle/usdRigView.exe" --usdRig-print-env)) {
            $name, $value = $line -split "=", 2
            Set-Item "env:$name" $value
          }
          & "$bundle/app/python/python.exe" -c "from pxr import Usd; import rigExecUsdview, rigexec, numpy; from UsdNoodles import _usdNoodles; from pxr import Plug; assert Plug.Registry().GetPluginWithName('rigExecUsdview') is not None; s = Usd.Stage.Open('$bundle/app/examples/rigexec_flat.usda'); assert s is not None; a = Usd.Stage.Open(str(s.GetRootLayer().realPath).replace('rigexec_flat.usda', 'ArmShotAnim.usda')); assert a and a.GetPrimAtPath('/Shot/HeroArm/Geom/ArmBody'); print('bundle smoke OK')"
          if ($LASTEXITCODE -ne 0) { throw "bundle python smoke failed" }
          & "$bundle/app/python/python.exe" "$bundle/app/usd/bin/usdview" --help | Select-Object -First 5
          if ($LASTEXITCODE -ne 0) { throw "usdview --help failed" }

      # The launcher must not inherit another USD/Python install from the
      # caller's environment (foreign pxr modules, plug-ins, or stale
      # runtime DLLs on PATH break the bundled interpreter on dev machines).
      - name: Smoke test launcher env isolation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
        run: |
          $bundle = "dist/usdRig-$env:VERSION_NUM-windows-x64"
          $bogus = Join-Path $env:RUNNER_TEMP "bogus-ambient"
          $env:PYTHONPATH = $bogus
          $env:PXR_PLUGINPATH_NAME = $bogus
          $env:PYTHONHOME = $bogus
          $printed = & "$bundle/usdRigView.exe" --usdRig-print-env
          if ($LASTEXITCODE -ne 0) { throw "print-env failed" }
          foreach ($name in "PYTHONPATH", "PXR_PLUGINPATH_NAME", "PYTHONHOME") {
            $line = $printed | Where-Object { $_ -like "$name=*" }
            if (-not $line -or $line.Contains($bogus)) {
              throw "ambient $name leaked into the bundle env: $line"
            }
          }
          $dll = $printed | Where-Object { $_ -like "PXR_USD_WINDOWS_DLL_PATH=*" }
          if (-not $dll -or -not $dll.Contains($bundle)) {
            throw "PXR_USD_WINDOWS_DLL_PATH does not pin the bundle: $dll"
          }

      - name: Sign bundle (Windows, when configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
          WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.WINDOWS_SIGNING_THUMBPRINT }}
        run: |
          $bundle = "dist/usdRig-$env:VERSION_NUM-windows-x64"
          if ($env:WINDOWS_SIGNING_CERT_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
            [IO.File]::WriteAllBytes($pfx,
              [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
            $secure = ConvertTo-SecureString `
              $env:WINDOWS_SIGNING_CERT_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx `
              -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            $env:WINDOWS_SIGNING_THUMBPRINT = $cert.Thumbprint
          }
          & packaging/sign-windows.ps1 -Bundle $bundle

      - name: Zip bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
        run: |
          Compress-Archive `
            -Path "dist/usdRig-$env:VERSION_NUM-windows-x64" `
            -DestinationPath "dist/usdRig-$env:VERSION_NUM-windows-x64.zip"

      # ---- macOS: assemble, smoke, sign + notarize, tar ----------------
      - name: Assemble, smoke, sign and tar bundle (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
          QT_QPA_PLATFORM: offscreen
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
          # Published releases must ship signed + notarized: the
          # signing script fails instead of warn-skipping when this
          # is 1. Test dispatches (publish=false) may stay unsigned.
          RIGEXEC_REQUIRE_NOTARIZATION: ${{ needs.gate.outputs.publish == 'true' && '1' || '0' }}
        run: |
          # Signing material never outlives this step, even on failure.
          cleanup_signing() {
            rm -f "${AC_API_KEY_PATH:-}" "$RUNNER_TEMP/certificate.p12"
            if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
              security delete-keychain \
                "$RUNNER_TEMP/signing.keychain-db" || true
            fi
          }
          trap cleanup_signing EXIT
          bundle="dist/usdRig-$VERSION_NUM-macos-arm64"
          python3 packaging/assemble_bundle.py \
            --usd-install usd-install --rig-install usdrig-install \
            --python-home "$pythonLocation" \
            --launcher build/usdRigView \
            --output "$bundle" --version "$VERSION_NUM" \
            --platform macos --platform-slug macos-arm64 \
            --source-root . --rig-build-dir build \
            --usdnoodles-dir build/python/UsdNoodles \
            --git-sha "${{ github.sha }}" --trim-dev
          exe="$bundle/usdRigView.app/Contents/MacOS/usdRigView"
          "$exe" --usdRig-check
          while IFS='=' read -r name value; do
            export "$name=$value"
          done < <("$exe" --usdRig-print-env)
          "$bundle/usdRigView.app/Contents/Resources/app/python/bin/python3" \
            -c "from pxr import Usd; import rigExecUsdview, rigexec, numpy; s = Usd.Stage.Open('$bundle/usdRigView.app/Contents/Resources/app/examples/rigexec_flat.usda'); assert s is not None; a = Usd.Stage.Open(str(s.GetRootLayer().realPath).replace('rigexec_flat.usda', 'ArmShotAnim.usda')); assert a and a.GetPrimAtPath('/Shot/HeroArm/Geom/ArmBody'); print('bundle smoke OK')"
          if [ -n "${MACOS_CERTIFICATE_BASE64:-}" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            p12="$RUNNER_TEMP/certificate.p12"
            echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$p12"
            security create-keychain -p actions "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p actions "$keychain"
            # Only codesign may use the imported private key.
            security import "$p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list \
              -S apple-tool:,apple:,codesign: -s -k actions "$keychain"
            # codesign only searches keychains on the search list,
            # and create-keychain does not add the new one to it.
            security list-keychains -d user -s "$keychain" \
              "$HOME/Library/Keychains/login.keychain-db"
            rm -f "$p12"
            if [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
              security find-identity -v -p codesigning "$keychain" | \
                grep -F "$MACOS_SIGNING_IDENTITY"
            fi
          fi
          if [ -n "${AC_API_KEY_BASE64:-}" ]; then
            export AC_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            echo "$AC_API_KEY_BASE64" | base64 --decode > "$AC_API_KEY_PATH"
          fi
          bash packaging/sign-macos.sh "$bundle"
          # The pre-sign smoke proves nothing about the hardened
          # runtime: re-check the signed + notarized bundle launches.
          "$exe" --usdRig-check
          while IFS='=' read -r name value; do
            export "$name=$value"
          done < <("$exe" --usdRig-print-env)
          "$bundle/usdRigView.app/Contents/Resources/app/python/bin/python3" \
            -c "from pxr import Usd; import rigExecUsdview, rigexec, numpy; s = Usd.Stage.Open('$bundle/usdRigView.app/Contents/Resources/app/examples/rigexec_flat.usda'); assert s is not None; a = Usd.Stage.Open(str(s.GetRootLayer().realPath).replace('rigexec_flat.usda', 'ArmShotAnim.usda')); assert a and a.GetPrimAtPath('/Shot/HeroArm/Geom/ArmBody'); print('signed bundle smoke OK')"
          tar -C dist -czf "$bundle.tar.gz" "$(basename "$bundle")"

      - name: Verify extracted macOS bundle without host Python
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
        run: |
          # Test the archive users receive, at a different path containing spaces.
          probe="$RUNNER_TEMP/relocated bundle"
          mkdir -p "$probe"
          tar -xzf "dist/usdRig-$VERSION_NUM-macos-arm64.tar.gz" -C "$probe"
          exe="$probe/usdRig-$VERSION_NUM-macos-arm64/usdRigView.app/Contents/MacOS/usdRigView"
          framework=/Library/Frameworks/Python.framework
          hidden="$RUNNER_TEMP/host-Python.framework"
          restore_python() {
            if [ -d "$hidden" ]; then
              sudo mv "$hidden" "$framework"
            fi
          }
          trap restore_python EXIT
          if [ -d "$framework" ]; then
            sudo mv "$framework" "$hidden"
          fi
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            "$exe" --usdRig-check
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            QT_QPA_PLATFORM=offscreen "$exe" --help
          stage="$probe/usdRig-$VERSION_NUM-macos-arm64/usdRigView.app/Contents/Resources/app/examples/rigexec_flat.usda"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            QT_QPA_PLATFORM=offscreen "$exe" "$stage" \
            --norender --quitAfterStartup
          stage="$probe/usdRig-$VERSION_NUM-macos-arm64/usdRigView.app/Contents/Resources/app/examples/ArmShotAnim.usda"
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            QT_QPA_PLATFORM=offscreen "$exe" "$stage" \
            --norender --quitAfterStartup
          app_bundle="${exe%/Contents/MacOS/usdRigView}"
          codesign --verify --deep --strict "$app_bundle"
          codesign --verify --strict "$app_bundle/Contents/Resources/app/python/Python"

      # ---- Linux: assemble, smoke, tar ---------------------------------
      - name: Assemble, smoke and tar bundle (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
          QT_QPA_PLATFORM: offscreen
        run: |
          bundle="dist/usdRig-$VERSION_NUM-linux-x64"
          python3 packaging/assemble_bundle.py \
            --usd-install usd-install --rig-install usdrig-install \
            --python-home "$pythonLocation" \
            --launcher build/usdRigView \
            --output "$bundle" --version "$VERSION_NUM" \
            --platform linux --platform-slug linux-x64 \
            --source-root . --rig-build-dir build \
            --usdnoodles-dir build/python/UsdNoodles \
            --git-sha "${{ github.sha }}" --trim-dev
          "$bundle/usdRigView" --usdRig-check
          while IFS='=' read -r name value; do
            export "$name=$value"
          done < <("$bundle/usdRigView" --usdRig-print-env)
          "$bundle/app/python/bin/python3" \
            -c "from pxr import Usd; import rigExecUsdview, rigexec, numpy; s = Usd.Stage.Open('$bundle/app/examples/rigexec_flat.usda'); assert s is not None; a = Usd.Stage.Open(str(s.GetRootLayer().realPath).replace('rigexec_flat.usda', 'ArmShotAnim.usda')); assert a and a.GetPrimAtPath('/Shot/HeroArm/Geom/ArmBody'); print('bundle smoke OK')"
          "$bundle/app/python/bin/python3" "$bundle/app/usd/bin/usdview" \
            --help | head -5
          tar -C dist -czf "$bundle.tar.gz" "$(basename "$bundle")"

      - name: Upload bundle archive
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.slug }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish GitHub Release
    needs: [gate, build]
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout usdRig (version sources for the notes)
        uses: actions/checkout@v4

      # Every value below is read from its source of truth at publish
      # time, so the notes cannot restate a stale version: the API
      # version from CMakeLists.txt, the .rigexec format range from
      # format.h, and the OpenUSD/Python pins from this workflow.
      - name: Compatibility notes
        env:
          VERSION_NUM: ${{ needs.gate.outputs.version-num }}
        run: |
          api="$(sed -n \
            's/^project(rigExec VERSION \([0-9.]*\) .*/\1/p' CMakeLists.txt)"
          format="$(sed -n \
            's/^inline constexpr uint32_t RigExecFormatVersion = \([0-9]*\);/\1/p' \
            libs/rigExecBinary/format.h)"
          oldest="$(sed -n \
            's/^inline constexpr uint32_t RigExecFormatOldestReadable = \([0-9]*\);/\1/p' \
            libs/rigExecBinary/format.h)"
          usd="$(grep -A5 'Checkout OpenUSD' .github/workflows/release.yml | \
            sed -n 's/.*ref: v\([0-9.]*\)/\1/p' | head -1)"
          python="$(sed -n \
            's/.*python-version: "\([0-9.]*\)"/\1/p' \
            .github/workflows/release.yml | head -1)"
          for value in "$api" "$format" "$oldest" "$usd" "$python"; do
            if [ -z "$value" ]; then
              echo "could not derive a compatibility version" >&2
              exit 1
            fi
          done
          if [ "$api" != "$VERSION_NUM" ]; then
            echo "CMake API version $api != release $VERSION_NUM" >&2
            exit 1
          fi
          cat > release-notes.md <<EOF
          ## Compatibility

          | | |
          |---|---|
          | usdRig API | $api (0.x: APIs and file formats may change without notice) |
          | OpenUSD | $usd with OpenExec (bundled in every download; no separate install needed) |
          | Python | $python (bundled) |
          | \`.rigexec\` format | writes format $format; reads formats $oldest-$format |
          | Platforms | Windows x64, macOS Apple Silicon (macOS 13+), Linux Ubuntu x86-64 |

          The macOS download is signed with Developer ID and notarized by Apple.
          EOF
          cat release-notes.md

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release-assets
          merge-multiple: true

      - name: Checksums (GPG-signed when configured)
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          cd release-assets
          sha256sum usdRig-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "${LINUX_GPG_PRIVATE_KEY:-}" ]; then
            echo "$LINUX_GPG_PRIVATE_KEY" | \
              gpg --batch --import
            printf '%s' "$LINUX_GPG_PASSPHRASE" | \
              gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
                --detach-sign --armor --output SHA256SUMS.txt.asc \
                SHA256SUMS.txt
            gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          else
            echo "warning: no GPG key configured; checksums unsigned" >&2
          fi

      - name: Create / update the Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.version }}
          name: usdRig ${{ needs.gate.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/usdRig-*.zip
            release-assets/usdRig-*.tar.gz
            release-assets/SHA256SUMS.txt*
