# The documentation site: MkDocs + Material, built from docs/ and published
# to GitHub Pages (Settings > Pages > Source: GitHub Actions).
#
# Strict, so a broken link or a missing image fails the build instead of
# shipping. Node pages are generated and committed (docs/build_pages.py);
# this job publishes them as they are and never regenerates them.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "icons/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
