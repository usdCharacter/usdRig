name: Architecture

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graphview-layers:
    name: GraphView layer inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the checker's own rules
        run: python3 tools/check_graphview_layers.py --self-test
      - name: Check the layer inventory
        run: python3 tools/check_graphview_layers.py
