# The RigExec documentation site: MkDocs + Material, built from docs/.
#
#   pip install -r docs/requirements.txt
#   python -m mkdocs serve        # live preview at http://127.0.0.1:8000
#   python -m mkdocs build        # static site in site/ (ignored by Git)
#
# Published to GitHub Pages by .github/workflows/docs.yml. The node pages
# and docs/index.md are generated by docs/build_pages.py; this site reads
# them as they are. docs/_mkdocs/hooks.py fills the node reference's
# navigation from docs/operator_notes.py, publishes the repository's
# icons/ beside the pages, points links to files outside docs/ at GitHub,
# and makes docs/home.md the landing page with the catalog at /reference/.

site_name: RigExec
site_description: >-
  An experimental character-rig evaluator for OpenUSD: controls, solvers,
  constraints and deformers evaluated live and published through Hydra.
site_url: https://usdcharacter.github.io/usdRig/
repo_url: https://github.com/usdCharacter/usdRig
repo_name: usdCharacter/usdRig
edit_uri: edit/main/docs/
copyright: >-
  RigExec is MIT licensed. Third-party material keeps its own terms.

docs_dir: docs
site_dir: site

exclude_docs: |
  *.py
  __pycache__/
  /_mkdocs/
  /site/
  requirements.txt
  copy-move-review.md
  # Their GIFs and images are not in the repository; left out until they
  # are, so the strict build keeps passing.
  concepts/tutorial-rolling-ball.md
  concepts/tutorial-godot-baked-rig.md

hooks:
  - docs/_mkdocs/hooks.py

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/usdCharacter/usdRig

nav:
  - Home: home.md
  - Get started:
      - guide/getting-started.md
      - guide/examples.md
  - Animator tools:
      - tools/index.md
      - tools/picker.md
      - tools/marking-menu.md
      - tools/touchpose.md
      - tools/limbs.md
      - Viewport gizmos: specs/viewport-gizmos.md
      - Graph editor: specs/graph-editor.md
      - View cube: specs/view-cube.md
  - Concepts:
      - concepts/how-operators-fire.md
      - concepts/baked-vs-dynamic.md
      - concepts/frame-cache-warming.md
      - concepts/wrinkle-deformation.md
      - concepts/external-movers.md
      - concepts/live-evaluator-inspection.md
      - Multi-stage imaging: multistage-imaging.md
  # The node reference's sections are filled in by docs/_mkdocs/hooks.py
  # from docs/operator_notes.py, so they follow the generator.
  - Node reference:
      - Catalog: index.md
  - Architecture:
      - Overview: specs/spec.md
      - Presentation: specs/rigexec-presentation.md
      - Standalone runtime: specs/standalone-runtime.md
      - Standalone pack: specs/standalone-pack.md
      - Upstream rig inputs: specs/upstream-inputs.md
      - Cross-domain inputs: specs/cross-domain-inputs.md
      - Source input replay: specs/input-replay.md
      - Execute publication buffers: specs/runtime-execute-buffers.md
      - Bake and inverse APIs: specs/python-bake-inverse.md
      - Composition arcs: specs/composition-arcs.md
      - Control guides: specs/control-guides.md
      - Volume weights: specs/volume-weights.md
      - Default spaces: specs/xformable-default-spaces.md
      - The biped rig: specs/biped-rig.md
      - OpenExec notes: specs/exec-api-notes.md
      - ExecUsd notes: specs/execusd-api-notes.md
      - Hydra notes: specs/hydra-integration-notes.md
  - References: references.md
